name: "SolidCraft Test 103 - Clippy-fixed native repair and Drawing regressions"
on:
  push:
    branches:
      - tests/solidcraft-t103
    paths:
      - .github/workflows/solidcraft-t103.yml
      - tests/fixtures/t103/**

permissions:
  contents: read

concurrency:
  group: solidcraft-t103-native-update-repair-poc
  cancel-in-progress: false

jobs:
  egui-warning-poc:
    name: "T103 / 7 corrected GUI repair/status cases plus Drawing regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: "84ef88b10e394c9ea9f90459c242e2033c6f7133"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Verify own fork and test branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$GITHUB_REF_NAME" = "tests/solidcraft-t103"

      - name: Checkout isolated overlay, read-only
        uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout precise Loohi PR 13211 source, read-only
        uses: actions/checkout@v4
        with:
          repository: Loohi/solidcraft
          ref: 84ef88b10e394c9ea9f90459c242e2033c6f7133
          path: src
          persist-credentials: false

      - name: Inject explicitly test-only proof of concept, never product
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../t103-report
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 ../overlay/tests/fixtures/t103/inject_tests.py | tee ../t103-report/inject.log
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | sort)" = "$(printf 'crates/ui-egui/src/drawing_sheet_page.rs\ncrates/ui-egui/src/drawing_sheet_page_tests.rs')"
          test -f crates/ui-egui/src/t103_warning_poc.rs
          printf "TEST=103\nBASE=Loohi/solidcraft#13211\nHEAD_SHA=%s\nPOC_SCOPE=CI_RUNNER_ONLY_CFG_TEST\nINTEGRATED_D07_GUI=NO\nREAL_REPAIR_CONTROL=TEMPORARY_TEST_ONLY\n" "$SOURCE_SHA" > ../t103-report/summary.txt

      - name: Install Rust stable, rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache native egui build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: t103-native-egui-poc
          cache-on-failure: true

      - name: Format and check prototype does not spill into production sources
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          cargo fmt --all > ../t103-report/fmt-apply.log 2>&1
          cargo fmt --all -- --check > ../t103-report/fmt-check.log 2>&1 || { tail -120 ../t103-report/fmt-check.log; exit 1; }
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          test "$(git diff --name-only | sort)" = "$(printf 'crates/ui-egui/src/drawing_sheet_page.rs\ncrates/ui-egui/src/drawing_sheet_page_tests.rs')"
          git diff > ../t103-report/runner-only-tests.patch
          cp crates/ui-egui/src/t103_warning_poc.rs ../t103-report/runner-only-warning-poc.rs
          timeout 39m cargo clippy -p solidcraft-engine -p solidcraft-ui-egui --all-targets --profile ci --locked -- -D warnings > ../t103-report/clippy.log 2>&1 || { tail -150 ../t103-report/clippy.log; exit 1; }
          echo "RUSTFMT_CLIPPY=PASS" >> ../t103-report/summary.txt

      - name: Compile native UI and Engine library test binaries once
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          timeout 66m cargo test -p solidcraft-ui-egui -p solidcraft-engine --lib --profile ci --locked --no-run --message-format=json > ../t103-report/build-artifacts.jsonl 2> ../t103-report/compile.log || { tail -150 ../t103-report/compile.log; exit 1; }
          echo "NATIVE_EGUI_COMPILED=PASS" >> ../t103-report/summary.txt

      - name: Run 7 new native GUI update/repair/state cases, four controls and two Drawing regression suites
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          runner=../overlay/tests/fixtures/t91/run_prebuilt.py
          binaries=../t103-report/build-artifacts.jsonl
          failures=0
          for item in \
            t103_native_update_button_clears_deferred_dimension_only_after_click \
            t103_native_lost_edge_repair_candidate_click_undo_redo \
            t103_native_no_repair_candidates_does_not_offer_false_action \
            t103_native_selected_repair_does_not_touch_other_dimension \
            t103_native_all_current_has_no_update_or_repair_buttons \
            t103_warning_message_prioritises_lost_ambiguous_and_stale \
            t103_warning_message_ignores_healthy_dimensions \
            the_plate_sheet_draws_its_lines_and_text \
            a_views_state_is_in_words \
            fit_sheet_shows_the_whole_sheet_and_zoom_stays_in_range \
            no_drawing_open_shows_the_note
          do
            if python3 "$runner" "$binaries" solidcraft_ui_egui "$item" "../t103-report/$item.log" pass 1 > "../t103-report/$item.outcome.txt" 2>&1; then
              echo "T103_PASS=$item" | tee -a ../t103-report/summary.txt
            else
              echo "T103_FAIL=$item" | tee -a ../t103-report/summary.txt
              tail -120 "../t103-report/$item.outcome.txt"
              failures=$((failures + 1))
            fi
          done
          # Complement the 5 new scenarios with both crates' complete Drawing subsets.
          # Each compiled binary is reused, so no pointless repeat compilation.
          for spec in "solidcraft_ui_egui drawing 15" "solidcraft_engine drawing 70"; do
            read -r crate pattern minimum <<< "$spec"
            if python3 "$runner" "$binaries" "$crate" "$pattern" "../t103-report/suite-$crate.log" pass "$minimum" > "../t103-report/suite-$crate.outcome.txt" 2>&1; then
              echo "T103_SUITE_PASS=$crate/$pattern; MINIMUM=$minimum" | tee -a ../t103-report/summary.txt
            else
              echo "T103_SUITE_FAIL=$crate/$pattern" | tee -a ../t103-report/summary.txt
              tail -120 "../t103-report/suite-$crate.outcome.txt"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            printf "FINAL=T103_PROTOTYPE_REQUIRES_REVIEW\nFAILURES=%s\n" "$failures" | tee -a ../t103-report/summary.txt
            exit 1
          fi
          echo "FINAL=T103_7_CLICKED_ACTION_CASES_4_CONTROLS_PLUS_DRAWING_SUITES_PASS_TEST_ONLY" | tee -a ../t103-report/summary.txt
          echo "7 native UI action/status tests, 4 controls and complete native UI/Engine Drawing regression suites. No product GUI integration." >> "$GITHUB_STEP_SUMMARY"

      - name: Archive original test logs and runner-only source even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t103-native-warning-poc
          path: t103-report/
          retention-days: 14
          if-no-files-found: warn
