name: SolidCraft M1A - status browser integration
on:
  push:
    branches: [tests/solidcraft-t119]
    paths: [.github/workflows/solidcraft-t119.yml]
permissions:
  contents: write
jobs:
  m1a:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact M1A source
        uses: actions/checkout@v4
        with:
          repository: Benny1496/solidcraft
          ref: feature/drawing-d07-d26-status-m1
          path: src
          persist-credentials: true
      - name: Verify source
        working-directory: src
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/drawing-d07-d26-status-m1"
          grep -Fq 'pub mod drawing_dimension_status;' crates/ui-egui/src/lib.rs
          grep -Fq 'Drawing status (read-only)' crates/ui-egui/src/drawing_workspace.rs
          git diff --check HEAD
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: t119-m1a
          cache-on-failure: true
      - name: Check source formatting
        working-directory: src
        shell: bash
        run: |
          mkdir -p ../t119-report
          cargo fmt --all > ../t119-report/fmt.log 2>&1 || { tail -100 ../t119-report/fmt.log; exit 1; }
          cargo fmt --all -- --check >> ../t119-report/fmt.log 2>&1 || { tail -100 ../t119-report/fmt.log; exit 1; }
          git diff -- crates/ui-egui/src/drawing_dimension_status.rs > ../t119-report/m1a-rustfmt.patch
          true # Format diff may be empty after prior successful formatting
          git config user.name 'SolidCraft Test Runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ui-egui/src/drawing_dimension_status.rs crates/ui-egui/src/drawing_status_controller.rs crates/ui-egui/src/drawing_workspace.rs crates/ui-egui/src/lib.rs
          if ! git diff --cached --quiet; then git commit -m 'style: apply rustfmt to M1-A modules'; fi
          git push origin HEAD:feature/drawing-d07-d26-status-m1
      - name: Compile UI
        working-directory: src
        shell: bash
        run: |
          timeout 100m cargo check -p solidcraft-ui-egui --locked > ../t119-report/check.log 2>&1 || { tail -160 ../t119-report/check.log; exit 1; }
      - name: Run M1A tests
        working-directory: src
        shell: bash
        run: |
          timeout 100m cargo test -p solidcraft-ui-egui --lib --profile ci --locked 'drawing_dimension_status::tests::' -- --nocapture > ../t119-report/tests.log 2>&1 || { tail -160 ../t119-report/tests.log; exit 1; }
          timeout 100m cargo test -p solidcraft-ui-egui --lib --profile ci --locked 'drawing_status_controller::tests::' -- --nocapture >> ../t119-report/tests.log 2>&1 || { tail -160 ../t119-report/tests.log; exit 1; }
          timeout 100m cargo test -p solidcraft-ui-egui --lib --profile ci --locked 'drawing_workspace::attention_integration_tests::' -- --nocapture >> ../t119-report/tests.log 2>&1 || { tail -160 ../t119-report/tests.log; exit 1; }
          test "$(grep -c 'test result: ok. 3 passed; 0 failed;' ../t119-report/tests.log)" -eq 2
          test "$(grep -c 'test result: ok. 4 passed; 0 failed;' ../t119-report/tests.log)" -eq 1
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t119-m1a-compile
          path: t119-report/
          if-no-files-found: warn
          retention-days: 30
