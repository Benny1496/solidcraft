name: SolidCraft assembly sheet parts list, Test 59 (fork only)

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-assembly-sheet-59.yml
      - tests/fixtures/w23-assembly-sheet-t59/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-assembly-sheet-59
  cancel-in-progress: false

env:
  UPSTREAM_DRAWINGS_SHA: fd4b7a7bc0e5d2de4eadf682eb2aee9510a5fc66

jobs:
  bom:
    name: Test 59 - assembly sheet parts list in bom_tests.rs on drawings
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout the patch (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout upstream drawings at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangency-labs/solidcraft
          ref: fd4b7a7bc0e5d2de4eadf682eb2aee9510a5fc66
          path: src
          persist-credentials: false
      - name: Apply the patch and check what it changes
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_DRAWINGS_SHA"
          git apply --index ../overlay/tests/fixtures/w23-assembly-sheet-t59/assembly-sheet-bom.patch
          git diff --cached --name-status | tee ../changed.txt
          printf 'M\tcrates/engine/src/cmd/bom_tests.rs\nA\ttests/fixtures/w23-assembly-sheet/README.md\nA\ttests/fixtures/w23-assembly-sheet/assembly.json\n' > ../expected.txt
          diff ../expected.txt ../changed.txt
          test "$(git diff --cached --numstat crates/engine/src/cmd/bom_tests.rs | cut -f2)" = "0"
          echo "T59_PATCH_APPLIED=PASS (only additions, no production code)"
          python3 -c "import json; json.load(open('tests/fixtures/w23-assembly-sheet/assembly.json'))"
          echo "T59_SCRIPT_JSON=PASS"
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          cache-on-failure: true
      - name: Check formatting of the changed test file
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/engine/src/cmd/bom_tests.rs
          echo "T59_FMT=PASS"
      - name: Run the bill of materials tests (no zero-test successes)
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../test59-report
          echo "upstream_drawings_sha=$UPSTREAM_DRAWINGS_SHA" > ../test59-report/metadata.txt
          echo "overlay_sha=$(git -C ../overlay rev-parse HEAD)" >> ../test59-report/metadata.txt
          set +e
          timeout 75m cargo test --profile ci -p solidcraft-engine --lib cmd::bom::tests -- --test-threads=2 2>&1 | tee ../test59-report/bom.log
          code=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("../test59-report/bom.log").read_text()
          new = (
              "the_assembly_sheets_parts_list_matches_the_hand_counts",
              "the_assembly_sheets_item_numbers_hold_through_edits_undo_and_reopening",
              "a_purchased_screw_keeps_the_assembly_sheets_counts",
              "a_phantom_holder_puts_what_it_holds_on_the_assembly_sheets_first_level",
          )
          for name in new:
              line = re.search(r"^test cmd::bom::tests::" + name + r" \.\.\. (\w+)$", text, re.M)
              print(f"T59_NEW {name}: {line.group(1) if line else 'MISSING'}")
          found = re.findall(r"test result: *([a-z]+)[.] *([0-9]+) passed; *([0-9]+) failed; *([0-9]+) ignored;", text)
          print(f"T59_RESULT {found}")
          assert all(re.search(r"^test cmd::bom::tests::" + n + r" \.\.\. ok$", text, re.M) for n in new), "a new test did not pass"
          assert len(found) == 1 and found[0][0] == "ok" and int(found[0][1]) > 4 and found[0][2] == "0" and found[0][3] == "0", found
          print(f"T59_BOM_TESTS=PASS count={found[0][1]}")
          PY
          test "$code" = 0
      - name: Preserve original test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t59-assembly-sheet-bom
          path: test59-report/
          if-no-files-found: warn
          retention-days: 14
