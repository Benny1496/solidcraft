name: SolidCraft Test 233 - drawing repair cleanup and focused quality gates
on:
  push:
    branches:
      - tests/solidcraft-t233
    paths:
      - .github/workflows/solidcraft-t233.yml
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check UI container rules
        run: cargo xtask ui-containers
      - name: Run focused Drawing UI tests and grade known failures
        shell: bash
        run: |
          junit=target/nextest/ci/junit.xml
          rm -f "$junit"
          status=0
          cargo nextest run -p solidcraft-ui-egui --lib --cargo-profile ci --locked --profile ci --no-tests=fail -E 'test(drawing_repair_ui) | test(drawing_attention_card) | test(drawing_dimension_repair) | test(drawing_status_controller) | test(drawing_status_engine) | test(drawing_dimension_status)' || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          test -s "$junit"
          cargo xtask known-failing --junit "$junit"
      - name: Strict Clippy for drawing UI crate
        run: cargo clippy -p solidcraft-ui-egui --lib --tests --profile ci --locked -- -D warnings
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-233-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7
