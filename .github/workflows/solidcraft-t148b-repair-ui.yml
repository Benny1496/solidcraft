name: SolidCraft Test 148b repair UI confirmation and undo
on:
  push:
    branches: [tests/solidcraft-t148-repair-gui]
    paths: ['.github/workflows/solidcraft-t148b-repair-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status-regression:
    name: Repair buttons confirm and undo
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install Rust test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl1 libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev
          df -h .
      - name: Exercise repair UI clicks and undo (separate lean build)
        run: |
          cargo test --locked -p solidcraft-ui-egui repair_lost_bore_through_visible_buttons_review_confirm_and_undo -- --nocapture
      - name: Disk diagnostics on failure
        if: failure()
        run: df -h . && du -sh target 2>/dev/null || true
