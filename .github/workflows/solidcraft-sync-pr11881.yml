name: "SolidCraft PR11881 - merge verified W23 regression onto drawings"
on:
  push:
    branches:
      - tests/solidcraft-t90
    paths:
      - .github/workflows/solidcraft-sync-pr11881.yml

permissions:
  contents: write

concurrency:
  group: solidcraft-pr11881-sync
  cancel-in-progress: false

jobs:
  sync-pr:
    name: "Sync PR11881 to drawings@67a32580 without losing W23 tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLD_PR_SHA: "67285b8def7a2a65804aa462e5264eab6b08eec7"
      DRAWINGS_SHA: "67a325808f5748e52b254849d7aef4b41ecfdce7"
      PR_BRANCH: "tests/w23-assembly-sheet-20261104"
    steps:
      - name: Verify repository and designated workflow branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$GITHUB_REF_NAME" = "tests/solidcraft-t90"

      - name: Checkout controlled merge-resolver
        uses: actions/checkout@v4
        with:
          ref: tests/solidcraft-t90
          path: overlay
          persist-credentials: false

      - name: Checkout pinned PR branch with scoped write credentials
        uses: actions/checkout@v4
        with:
          repository: Benny1496/solidcraft
          ref: 67285b8def7a2a65804aa462e5264eab6b08eec7
          fetch-depth: 0
          path: src
          persist-credentials: true

      - name: Merge approved official drawings commit, safeguarding both test blocks
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../pr11881-sync-report
          test "$(git rev-parse HEAD)" = "$OLD_PR_SHA"
          git config user.name "Benny1496 SolidCraft Validation"
          git config user.email "Benny1496@users.noreply.github.com"
          git fetch origin "refs/heads/$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$OLD_PR_SHA"
          git fetch https://github.com/tangency-labs/solidcraft.git refs/heads/drawings
          test "$(git rev-parse FETCH_HEAD)" = "$DRAWINGS_SHA" || {
            echo "::error::Upstream changed: refuse to merge a different branch head."
            exit 1
          }
          git checkout -B pr11881-synced "$OLD_PR_SHA"
          if ! git merge --no-ff --no-edit -m "Merge drawings@67a32580 into W23 PR (#12394)" "$DRAWINGS_SHA" > ../pr11881-sync-report/merge.log 2>&1; then
            git status --short > ../pr11881-sync-report/conflicts.txt
            python3 ../overlay/tests/fixtures/t90/resolve_append_only_view_tests.py > ../pr11881-sync-report/merge-resolution.log 2>&1 || {
              cat ../pr11881-sync-report/merge.log
              cat ../pr11881-sync-report/conflicts.txt
              cat ../pr11881-sync-report/merge-resolution.log
              exit 1
            }
            git commit --no-edit -m "Merge drawings@67a32580 into W23 PR (#12394)" >> ../pr11881-sync-report/merge.log
          fi
          git merge-base --is-ancestor "$OLD_PR_SHA" HEAD
          git merge-base --is-ancestor "$DRAWINGS_SHA" HEAD
          test "$(grep -c 'fn the_assembly_sheet_refuses_a_balloon_on_its_hidden_second_holder()' crates/engine/src/cmd/drawing_balloon_tests.rs)" -eq 1
          test "$(grep -c 'fn a_balloon_is_refused_on_a_part_its_view_leaves_out()' crates/engine/src/cmd/drawing_balloon_tests.rs)" -eq 1
          test "$(grep -c 'fn the_assembly_sheets_views_keep_what_they_show_through_the_model()' crates/engine/src/cmd/drawing_view_tests.rs)" -eq 1
          test "$(grep -c 'fn a_left_out_part_says_where_each_kind_of_setter_set_it()' crates/engine/src/cmd/drawing_view_tests.rs)" -eq 1
          git diff --check
          printf "BASE=%s\nPR_ORIGINAL=%s\nMERGED_HEAD=%s\nRESOLUTION=PASS\n" "$DRAWINGS_SHA" "$OLD_PR_SHA" "$(git rev-parse HEAD)" > ../pr11881-sync-report/summary.txt

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format imported Rust regression without modifying unrelated files
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          cargo fmt --all
          changes="$(git diff --name-only)"
          if [ -n "$changes" ] && [ "$changes" != "crates/engine/src/cmd/drawing_balloon_tests.rs" ]; then
            echo "::error::Rustfmt touched unexpected paths: $changes"
            exit 1
          fi
          git diff --check
          cargo fmt --all -- --check
          if [ -n "$changes" ]; then
            git add -- crates/engine/src/cmd/drawing_balloon_tests.rs
            git commit -m "style(drawings): format W23 hidden-holder regression" 
          fi
          echo "FMT=PASS" >> ../pr11881-sync-report/summary.txt
          git status --porcelain | tee ../pr11881-sync-report/status.txt
          test -z "$(git status --porcelain)"

      - name: Validate W23 fixture and ensure no other PR changes
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          python3 tests/fixtures/w23-assembly-sheet/validate.py | tee ../pr11881-sync-report/validate.log
          git merge-base --is-ancestor "$OLD_PR_SHA" HEAD
          git merge-base --is-ancestor "$DRAWINGS_SHA" HEAD
          test -z "$(git status --porcelain)"
          echo "STATIC_FIXTURE_CHECK=PASS" >> ../pr11881-sync-report/summary.txt
          git log -5 --oneline >> ../pr11881-sync-report/summary.txt

      - name: Fast-forward only the original PR branch
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)"
          test "$actual" = "$OLD_PR_SHA" || {
            echo "::error::PR branch moved since preparation; refuse to overwrite new work."
            exit 1
          }
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "PUSH=PASS" >> ../pr11881-sync-report/summary.txt
          echo "NEW_HEAD=$(git rev-parse HEAD)" >> ../pr11881-sync-report/summary.txt

      - name: Preserve merge and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-pr11881-sync-proof
          path: pr11881-sync-report/
          retention-days: 14
          if-no-files-found: warn
