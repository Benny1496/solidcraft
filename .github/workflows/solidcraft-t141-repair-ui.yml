name: SolidCraft Test 141 - Repair UI Integration
on:
  push:
    branches:
      - feature/issue-15776-drawings-20261113
    paths:
      - '.github/workflows/solidcraft-t141-repair-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify revision
        run: git rev-parse HEAD
      - name: Compile Drawing UI integration
        run: cargo check -p solidcraft-ui-egui
      - name: Repair UI state and eligibility tests
        run: cargo test -p solidcraft-ui-egui --lib drawing_repair_ui -- --nocapture
      - name: Repair confirmation gate
        run: cargo test -p solidcraft-ui-egui --lib drawing_dimension_repair -- --nocapture
      - name: Drawing browser regressions
        run: cargo test -p solidcraft-ui-egui --lib drawing_workspace -- --nocapture
      - name: Status refresh regressions
        run: cargo test -p solidcraft-ui-egui --lib drawing_status_controller -- --nocapture
      - name: Engine undo redo repair regression
        run: cargo test -p solidcraft-engine --lib a_repair_is_one_undo_step_and_undone_is_lost_again -- --nocapture
