name: "SolidCraft Test 75: PR 11881 rebased onto drawings 188192c with recipes 3 to 6 native, alone and with PR 8288 (fork only)"

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-pr11881-rebased-75.yml
      - tests/fixtures/t75/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-pr11881-rebased-75
  cancel-in-progress: false

env:
  BASE_SHA: 188192cb8bc1eac9f515120df80df5d5f66205f1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  pr11881:
    name: "Test 75 - PR 11881 (9c630db) on drawings@188192c, ${{ matrix.tree }}: repository checks, clippy, all engine tests, known-failing"
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tree: [alone, with-8288]
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
      ACTION_MATRIX_JOBS: "4"
    steps:
      - name: Make room on the runner
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Checkout the patches (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout drawings at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangency-labs/solidcraft
          ref: 188192cb8bc1eac9f515120df80df5d5f66205f1
          path: src
          persist-credentials: false
      - name: Apply #11881's new head, and #8288's for the together tree
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --index ../overlay/tests/fixtures/t75/pr11881-on-188192c.diff
          if [ "${{ matrix.tree }}" = "with-8288" ]; then git apply --index ../overlay/tests/fixtures/t75/pr8288-on-188192c.diff; fi
          git diff --cached --stat
          echo "T75_APPLIED=PASS (${{ matrix.tree }})"
      - name: Install a software Vulkan driver (lavapipe), as the upstream test job does
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: t75-${{ matrix.tree }}
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Repository checks, as the upstream "Format and repository checks" job runs them
        shell: bash
        working-directory: src
        run: |
          set -uo pipefail
          mkdir -p ../t75-report
          fails=0
          check() {
            local name="$1"; shift
            if "$@" > "../t75-report/check-${name}.log" 2>&1; then
              echo "T75_CHECK ${name}: PASS"
            else
              echo "T75_CHECK ${name}: FAIL"; tail -40 "../t75-report/check-${name}.log"; fails=$((fails + 1))
            fi
          }
          check fmt cargo fmt --all -- --check
          check assets cargo xtask assets
          check icons cargo xtask icons
          check licences cargo xtask licences --check
          check layers cargo xtask layers
          check ui-containers bash -c 'cargo xtask ui-containers && cargo test -p xtask ui_containers --locked'
          check lists cargo xtask lists
          check i18n cargo xtask i18n --check
          check skills bash -c 'cargo xtask skills && cargo test -p xtask skills --locked'
          check format-pending bash scripts/test-format-pending.sh
          check web-offline cargo xtask web-offline-test
          check affected-selftest python3 -I scripts/ci/test_affected.py
          check main-merge-selftest python3 -I scripts/ci/test_main_merge.py
          check bot-tests bash -c 'node --test scripts/claim/*.test.js scripts/triage/*.test.js scripts/kernel-paused/*.test.js scripts/pr-checks/*.test.js'
          check w23-assembly-static python3 -I tests/fixtures/w23-assembly-sheet/validate.py
          if [ -f tests/fixtures/w23a-drawing-updates/validate.py ]; then check w23a-static python3 -I tests/fixtures/w23a-drawing-updates/validate.py; fi
          echo "T75_CHECKS_FAILED=${fails}"
          test "$fails" = 0
      - name: Clippy -D warnings on the engine, all targets
        if: always()
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          timeout 120m cargo clippy -p solidcraft-engine --all-targets --profile ci --locked -- -D warnings 2>&1 | tee ../t75-report/clippy.log
          test "${PIPESTATUS[0]}" = 0
          echo "T75_CLIPPY_ENGINE=PASS"
      - name: All engine tests as CI runs them, then known-failing grades the run
        if: always()
        shell: bash
        working-directory: src
        run: |
          set +e
          set -uo pipefail
          base='default() & not (binary(action_matrix) & test(=action_matrix_sample))'
          timeout 230m cargo nextest run -p solidcraft-engine --cargo-profile ci --locked --profile ci --no-tests=pass \
            --ignore-default-filter -E "($base) & not (package(=solidcraft-gpu) & test(/^path::/))" 2>&1 | tee ../t75-report/engine-tests.log
          status=${PIPESTATUS[0]}
          cp target/nextest/ci/junit.xml ../t75-report/engine-junit.xml 2>/dev/null
          grep -E "Summary \[" ../t75-report/engine-tests.log | sed 's/^/T75_SUMMARY /'
          grep -E "^\s+(FAIL|SIGSEGV|SIGABRT|TIMEOUT) " ../t75-report/engine-tests.log | sort -u | sed 's/^/T75_NOT_PASSED /' | head -40
          echo "T75_NEXTEST_EXIT=$status (0 all passed, 100 some failed)"
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("../t75-report/engine-tests.log").read_text(errors="replace")
          ours = {
              "cmd::bom::tests": ["the_assembly_sheets_parts_list_matches_the_hand_counts", "the_assembly_sheets_item_numbers_hold_through_edits_undo_and_reopening", "a_purchased_screw_keeps_the_assembly_sheets_counts", "a_phantom_holder_puts_what_it_holds_on_the_assembly_sheets_first_level"],
              "cmd::drawing_balloon::tests": ["balloons_on_the_assembly_sheet_follow_the_model_and_its_revision_rows_stay", "balloons_on_the_assembly_sheet_read_their_holders_row"],
              "cmd::drawing_table::tests": ["the_assembly_sheet_keeps_its_parts_list_revisions_and_tag_through_the_model"],
          }
          for module, names in ours.items():
              for name in names:
                  full = f"{module}::{name}"
                  m = re.search(r"^\s+(PASS|FAIL|SIGSEGV|SIGABRT|TIMEOUT) \[[^\]]*\] (?:\([^)]*\) )?solidcraft-engine " + re.escape(full) + r"$", log, re.M)
                  verdict = m.group(1) if m else "MISSING"
                  print(f"T75_OURS {full}: {verdict}")
                  if verdict != "PASS":
                      at = log.find(f"thread '{full}'")
                      why = log[at:at + 1500] if at >= 0 else "no panic text found"
                      print(f"::error title={name}::" + why.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit target/nextest/ci/junit.xml 2>&1 | tee ../t75-report/known-failing.log
          kf=${PIPESTATUS[0]}
          echo "T75_KNOWN_FAILING_EXIT=$kf"
          test "$kf" = 0 && echo "T75_ENGINE_TESTS_AS_CI=PASS"
          test "$kf" = 0
      - name: Preserve original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t75-${{ matrix.tree }}
          path: t75-report/
          if-no-files-found: warn
          retention-days: 14
