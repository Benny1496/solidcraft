name: SolidCraft Test 204 - latest main port
on:
  push:
    branches:
      - integration/pr16310-t201-current-main-20261119
    paths:
      - '.github/workflows/solidcraft-t204.yml'
permissions:
  contents: read
jobs:
  remaining:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope: [engine-drawing, ui-drawing]
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t204"
          cp -r tests/fixtures/t204 "$RUNNER_TEMP/t204-fixtures"
          git fetch --no-tags https://github.com/Benny1496/solidcraft.git 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          base=$(git merge-base 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 cc5acc82b9cb8fcbc624537b14d18c58efd6321f)
          test "$base" = f1cc6e70f9337bc940ecc27d2f1d31438df36ce2
          git diff --binary "$base" 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 -- . ':!crates/ui-egui/src/drawing_workspace.rs' > "$RUNNER_TEMP/t204/original.patch"
          git switch --detach cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          test "$(git rev-parse HEAD)" = cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          git apply --3way --index "$RUNNER_TEMP/t204/original.patch"
          cp -r "$RUNNER_TEMP/t204-fixtures/." .
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          git merge-tree --write-tree 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 c4c9aa1005135f4084c7d8776a4e3ff25c104e80 > "$RUNNER_TEMP/t204/merge-tree.txt" || true
          git add assets/locales/pending attribution/pending crates/ui-egui/src
          git diff --cached --binary HEAD -- . ':!crates/ui-egui/src/drawing_workspace.rs' ':!crates/ui-egui/src/drawing_workspace/browser.rs' > "$RUNNER_TEMP/t204/port.patch"
          git reset --hard HEAD
          git clean -fd
          git switch --detach c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          test "$(git rev-parse HEAD)" = c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          git apply --3way --index "$RUNNER_TEMP/t204/port.patch"
          cp "$RUNNER_TEMP/t204-fixtures/crates/ui-egui/src/drawing_workspace.rs" crates/ui-egui/src/drawing_workspace.rs
          cp "$RUNNER_TEMP/t204-fixtures/crates/ui-egui/src/drawing_workspace/browser.rs" crates/ui-egui/src/drawing_workspace/browser.rs
          git add assets/locales/pending attribution/pending crates/ui-egui/src
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/t204/integration.patch"
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git 32efab6cfc2cdd0967410bbb1c078f8517eabc8d
          git reset --hard HEAD
          git clean -fd
          git switch --detach 32efab6cfc2cdd0967410bbb1c078f8517eabc8d
          git apply --3way --index "$RUNNER_TEMP/t204/integration.patch" || { git status --short; git diff --cc > "$RUNNER_TEMP/t204/conflicts.patch"; exit 1; }
          git diff --cached --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: T204-${{ matrix.scope }}-conflicts
          path: ${{ runner.temp }}/t204/
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libwayland-dev libasound2-dev pkg-config xvfb xauth dbus-x11 at-spi2-core python3-pyatspi libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dri openbox

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format clean product source
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff HEAD --binary > "$RUNNER_TEMP/t204/formatted.patch"
          if grep -nE 'T19[4-7] (CLICK|CLEAR|REFRESH|CONFIRM)|t194_handle' crates/ui-egui/src/drawing_repair_ui.rs crates/ui-egui/src/drawing_workspace.rs; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: T204-${{ matrix.scope }}-preflight
          path: ${{ runner.temp }}/t204/
      - name: Run only outstanding gate
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
          ACTION_MATRIX_JOBS: 2
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/t204"
          df -h
          free -h
          cargo xtask fast 2>&1 | tee "$report/fast.txt"
          args=()
          case "$SCOPE" in
            engine-drawing) args=(-p solidcraft-engine --features raytrace-cpu) ;;
            ui-drawing) args=(-p solidcraft-ui-egui --features solidcraft-engine/raytrace-cpu) ;;
            *) exit 2 ;;
          esac
          filter='test(drawing)'
          partition=()
          printf '\n[profile.local-ci.junit]\npath = "junit.xml"\n' >> .config/nextest.toml
          set +e
          cargo nextest run "${args[@]}" --cargo-profile ci --locked --profile local-ci --ignore-default-filter --no-fail-fast --retries 0 --no-tests fail --test-threads 2 -E "$filter" "${partition[@]}" 2>&1 | tee "$report/nextest.txt"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 0 || test "$status" = 100
          cp target/nextest/local-ci/junit.xml "$report/junit.xml"
          cargo xtask known-failing --junit "$report/junit.xml" 2>&1 | tee "$report/grading.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T204-${{ matrix.scope }}-results
          path: ${{ runner.temp }}/t204/
