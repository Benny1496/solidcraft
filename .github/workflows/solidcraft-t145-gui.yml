name: SolidCraft Test 145 GUI startup
on:
  push:
    branches: [tests/solidcraft-t145-source]
    paths: ['.github/workflows/solidcraft-t145-gui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libgtk-3-dev libxkbcommon-dev libasound2-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build SolidCraft desktop
        run: cargo build --locked -p solidcraft
      - name: Run real GUI and capture screenshots
        run: |
          mkdir -p gui-evidence
          export SOLIDCRAFT_CONTROL_TOKEN="$(openssl rand -hex 32)"
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >gui-evidence/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 3
          ./target/debug/solidcraft --sample --control 27878 >gui-evidence/app.log 2>&1 &
          python3 - <<'PY'
          import json,os,socket,time
          from pathlib import Path
          out=Path("gui-evidence")
          for i in range(120):
              try:
                  sock=socket.create_connection(("127.0.0.1",27878),timeout=3)
                  break
              except OSError: time.sleep(2)
          else: raise RuntimeError("Desktop GUI control port unavailable; inspect app.log and xvfb.log")
          sock.settimeout(90)
          f=sock.makefile("rwb")
          def req(i,method,params):
              p={"id":i,"method":method,"params":params}
              if i==1: p["token"]=os.environ["SOLIDCRAFT_CONTROL_TOKEN"]
              f.write((json.dumps(p)+"\n").encode());f.flush()
              reply=json.loads(f.readline())
              (out/f"reply-{i}.json").write_text(json.dumps(reply,indent=2))
              if reply.get("ok") is False: raise RuntimeError(f"{method}: {reply.get('error')}")
          req(1,"ui.inspect",{})
          for i,(w,h) in enumerate([(1280,720),(960,640)],start=2):
              req(i*2,"ui.resize",{"width":w,"height":h})
              time.sleep(3)
              req(i*2+1,"ui.screenshot",{"path":str((out/f"desktop-{w}x{h}.png").resolve())})
          pics=list(out.glob("desktop-*.png"))
          assert len(pics)==2 and all(p.stat().st_size>1000 for p in pics)
          print("T145_GUI_SMOKE_SUCCESS")
          PY
      - name: Print GUI diagnostics on failure
        if: failure()
        run: |
          echo "=== APP LOG ==="
          tail -n 160 gui-evidence/app.log || true
          echo "=== XVFB LOG ==="
          tail -n 100 gui-evidence/xvfb.log || true
          echo "=== PROCESS ==="
          ps aux | grep -E "solidcraft|Xvfb" | grep -v grep || true
          echo "=== PORT ==="
          ss -lntp | grep 27878 || true
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t145-gui-evidence
          path: gui-evidence/
          retention-days: 14
