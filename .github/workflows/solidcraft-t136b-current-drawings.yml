name: SolidCraft Test 136b - Current Drawings Integration
on:
  push:
    branches:
      - tests/issue-15776-t136b-current-drawings
    paths:
      - '.github/workflows/solidcraft-t136b-current-drawings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drawing-status-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile current Drawing UI
        run: cargo check -p solidcraft-ui-egui
      - name: Drawing status tests
        run: cargo test -p solidcraft-ui-egui --lib drawing_status -- --nocapture
      - name: Attention card tests
        run: cargo test -p solidcraft-ui-egui --lib drawing_attention_card::tests -- --nocapture
      - name: Sheet page tests
        run: cargo test -p solidcraft-ui-egui --lib drawing_sheet_page -- --nocapture
