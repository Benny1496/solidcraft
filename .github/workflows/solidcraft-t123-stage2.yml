name: SolidCraft Stage 2 Test 123 Negative
on:
  push:
    branches:
      - tests/solidcraft-t123-negative
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sensor-stage2-shared
      - name: Execute actual stage 2 negative integration
        run: |
          set -euo pipefail
          mkdir -p t123-report
          timeout 95m cargo test -p solidcraft-ui-egui --lib --profile ci stage2_negative_enclosure_deleted_screw_reports_lost_reference -- --nocapture 2>&1 | tee t123-report/result.log
      - name: Upload original log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t123-sensor-stage2
          path: t123-report/
          retention-days: 30
