name: SolidCraft Test 247 - PR 16310 GPU diagnostic
on:
  push:
    branches:
      - tests/solidcraft-t247
    paths:
      - .github/workflows/solidcraft-t247.yml
permissions:
  contents: read
jobs:
  gpu-diagnostic:
    if: github.repository == 'Benny1496/solidcraft' && github.ref == 'refs/heads/tests/solidcraft-t247'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      PR_HEAD: "0f02cb00dc4d7255b936985bc92ac930c9c0c9f8"
      BASE: "3137754fcad295bbfc02c8325390a1a583380fba"
      BUNDLE_COMMIT: "537108070330db038e96d9d7f4eb890b5eb5ff58"
      PATCH_SHA: "0fc7b07fdfca6c916038504df0b8d503849cac95a8f56620192cbb4b2eeaac01"
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
      VIEWPORT_TEST_GPU: software
      VIEWPORT_TEST_REQUIRE_GPU: "1"
      RUST_MIN_STACK: "8388608"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MESA_SHADER_CACHE_DIR: /home/runner/.cache/mesa-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the exact previously tested product
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t247-evidence"
          mkdir -p "$out"
          test "$(git rev-parse HEAD^)" = "$BUNDLE_COMMIT"
          test "$(git rev-parse HEAD^^)" = "$PR_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/solidcraft-t247.yml"
          test "$(git diff --name-only HEAD^^ HEAD^)" = ".github/test-data/pr16310-t247/bundle.json"
          cp .github/test-data/pr16310-t247/bundle.json "$out/bundle.json"
          git switch --detach "$PR_HEAD"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test -z "$(git status --porcelain)"
          python3 - "$out" <<'PY'
          import hashlib, json, os, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          b = json.loads((out / "bundle.json").read_text())
          p = b["patch"].encode("utf-8")
          m = b["manifest"]
          assert m["head"] == os.environ["PR_HEAD"]
          assert m["base"] == os.environ["BASE"]
          assert len(m["files"]) == 10 and len(p) == 101064
          assert hashlib.sha256(p).hexdigest() == b["patch_sha256"] == os.environ["PATCH_SHA"]
          (out / "expected.patch").write_bytes(p)
          (out / "manifest.json").write_text(json.dumps(m, indent=2) + "\n")
          PY
          git apply --check --binary "$out/expected.patch"
          git apply --binary "$out/expected.patch"
          git diff --binary --no-ext-diff --no-textconv HEAD > "$out/before.patch"
          cmp "$out/expected.patch" "$out/before.patch"
          python3 - "$out" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          m = json.loads((out / "manifest.json").read_text())
          entries = m["files"]
          changed = set(filter(None, subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-only", "-z", "HEAD"]).decode().split("\0")))
          assert changed == {f["path"] for f in entries}
          assert not subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          for f in entries:
              p = pathlib.Path(f["path"])
              if f.get("deleted"):
                  assert not p.exists() and not p.is_symlink(), f["path"]
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == f["sha256"], f["path"]
          print("PASS: exact product patch and 10 changed paths")
          PY
          printf 'HEAD=%s\nBASE=%s\nPATCH_SHA=%s\n' "$PR_HEAD" "$BASE" "$PATCH_SHA" | tee "$out/source.txt"
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          mkdir -m 700 "$RUNNER_TEMP/t247-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/t247-runtime" >> "$GITHUB_ENV"
      - name: Size parallel compiles to runner memory
        run: bash scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.150
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        continue-on-error: true
        with:
          key: native-gpu
          save-if: false
      - name: Restore existing shader cache if available
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: /home/runner/.cache/mesa-gpu
          key: mesa-gpu-${{ runner.os }}-${{ hashFiles('crates/gpu/src/**/*.wgsl') }}
          restore-keys: mesa-gpu-${{ runner.os }}-
      - name: Record test environment
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            cat /etc/os-release
            lscpu
            free -h
            rustc --version
            cargo --version
            cargo nextest --version
            dpkg-query -W mesa-vulkan-drivers libvulkan1
            printf 'SOLIDCRAFT_GPU=%s\nSOLIDCRAFT_REQUIRE_GPU=%s\n' "$SOLIDCRAFT_GPU" "$SOLIDCRAFT_REQUIRE_GPU"
            printf 'CARGO_BUILD_JOBS=%s\nXDG_RUNTIME_DIR=%s\n' "${CARGO_BUILD_JOBS:-auto}" "$XDG_RUNTIME_DIR"
          } | tee "$RUNNER_TEMP/t247-evidence/environment.txt"
      - name: Run exactly four GPU tests and grade the fresh JUnit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t247-evidence"
          junit="$CARGO_TARGET_DIR/nextest/ci/junit.xml"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git diff --binary --no-ext-diff --no-textconv HEAD | cmp "$out/expected.patch" -
          if [ -e "$junit" ]; then
            test -f "$junit" && test ! -L "$junit"
            cp "$junit" "$out/prior-junit.xml"
            rm -f "$junit"
          fi
          filter='package(=solidcraft-gpu) & (test(=path::tests::delta_source_photon_power_matches_directional_and_point_disk_integrals) | test(=path::tests::guided_photons_preserve_parallel_point_spot_and_area_power_at_a_translated_aperture) | test(=path::tests::photon_subsurface_flight_precedes_a_closer_analytic_emitter) | test(=path::tests::rough_volume_photon_kernels_and_hg_delta_connection_match_independent_measures))'
          status=0
          cargo nextest run -p solidcraft-gpu --lib --cargo-profile ci --locked --profile ci --ignore-default-filter --no-tests=fail --no-fail-fast --retries 0 --success-output final -E "$filter" 2>&1 | tee "$out/nextest.log" || status=$?
          printf 'Nextest exit code: %s\n' "$status" | tee "$out/exit-codes.txt"
          case "$status" in 0|100) ;; *) exit "$status";; esac
          test -s "$junit"
          cp "$junit" "$out/junit.xml"
          python3 - "$out/junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          expected = {
              "path::tests::delta_source_photon_power_matches_directional_and_point_disk_integrals",
              "path::tests::guided_photons_preserve_parallel_point_spot_and_area_power_at_a_translated_aperture",
              "path::tests::photon_subsurface_flight_precedes_a_closer_analytic_emitter",
              "path::tests::rough_volume_photon_kernels_and_hg_delta_connection_match_independent_measures",
          }
          cases = [t for t in ET.parse(sys.argv[1]).iter("testcase") if t.find("skipped") is None]
          assert len(cases) == 4 and {t.get("name") for t in cases} == expected
          for t in cases:
              assert "solidcraft-gpu" in t.get("classname", "")
              failed = t.find("failure") is not None or t.find("error") is not None
              print(("FAIL" if failed else "PASS"), t.get("name"), t.get("time"))
          PY
          grade=0
          cargo xtask known-failing --junit "$junit" 2>&1 | tee "$out/known-failing.log" || grade=$?
          printf 'Known-Failing exit code: %s\n' "$grade" | tee -a "$out/exit-codes.txt"
          git diff --binary --no-ext-diff --no-textconv HEAD > "$out/after.patch"
          cmp "$out/expected.patch" "$out/after.patch"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$status" -eq 0
          test "$grade" -eq 0
      - name: Hash available evidence
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/t247-evidence"
          mkdir -p "$out"
          cd "$out"
          find . -maxdepth 1 -type f ! -name checksums.sha256 -print0 | sort -z | xargs -0 -r sha256sum > checksums.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: T247-PR16310-gpu-evidence
          path: ${{ runner.temp }}/t247-evidence/
          retention-days: 7
          if-no-files-found: error
