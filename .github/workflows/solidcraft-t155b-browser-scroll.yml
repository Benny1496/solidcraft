name: SolidCraft Test 155b pointer hit trace
on:
  push:
    branches: [tests/solidcraft-t155b-browser-scroll]
    paths: ['.github/workflows/solidcraft-t155b-browser-scroll.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointer-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream drawings only in runner
        run: |
          git config user.name "SolidCraft CI"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream drawings
          echo "UPSTREAM_DRAWINGS_SHA=$(git rev-parse FETCH_HEAD)"
          git merge --no-commit --no-ff -X ours FETCH_HEAD > /tmp/merge.log 2>&1 || { tail -n 80 /tmp/merge.log; exit 1; }
          git show HEAD:crates/ui-egui/src/drawing_workspace.rs > crates/ui-egui/src/drawing_workspace.rs
          echo "T155b: retained test-side drawing_workspace.rs, merged other upstream changes"
          git diff --check
          test -f crates/ui-egui/src/drawing_repair_ui.rs
      - name: Add browser scroll wrapper and pointer trace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ui-egui/src/drawing_workspace.rs')
          s=p.read_text()
          anchor='pub(crate) fn browser_contents(app: &mut SolveApp, ui: &mut egui::Ui) {'
          assert s.count(anchor)==1
          s=s.replace(anchor, '''pub(crate) fn browser_contents(app: &mut SolveApp, ui: &mut egui::Ui) {
              egui::ScrollArea::vertical().id_salt("drawing_browser").min_scrolled_height(0.0).show(ui, |ui| browser_rows_with_repair(app, ui));
          }

          fn browser_rows_with_repair(app: &mut SolveApp, ui: &mut egui::Ui) {''',1)
          p.write_text(s)
          print("T155b browser scroll wrapper injected")
          p=Path('crates/ui-egui/src/drawing_repair_ui.rs')
          s=p.read_text()
          a='        if ui.button(format!("Repair {}", dim.id)).clicked() {'
          assert s.count(a)==1
          s=s.replace(a,'''        let response = ui.button(format!("Repair {}", dim.id));
          let pointer = ui.input(|input| input.pointer.interact_pos());
          eprintln!("T155b BUTTON id={} rect={:?} clip={:?} pointer={:?} hover={} clicked={} enabled={} contains_pointer={} contains_clip={} pressed={} released={}", dim.id, response.rect, ui.clip_rect(), pointer, response.hovered(), response.clicked(), response.enabled(), pointer.map(|p| response.rect.contains(p)).unwrap_or(false), pointer.map(|p| ui.clip_rect().contains(p)).unwrap_or(false), ui.input(|i| i.pointer.any_pressed()), ui.input(|i| i.pointer.any_released()));
          if response.clicked() {''',1)
          p.write_text(s)
          p=Path('crates/ui-egui/src/drawing_workspace.rs')
          s=p.read_text()
          a='        h.step(&serde_json::json!({"widget":action})).unwrap();'
          assert s.count(a)==1
          s=s.replace(a,'''        eprintln!("T155b HARNESS initial widget_center={:?}", h.widget(&action));
          for attempt in 0..24 {
              let point = h.widget(&action).expect("repair widget remains in accessibility tree");
              eprintln!("T155b SCROLL attempt={attempt} widget_y={:.2}", point[1]);
              if (207.0..=291.0).contains(&point[1]) { break; }
              let delta = if point[1] > 291.0 { -90.0 } else { 90.0 };
              h.call("ui.scroll", serde_json::json!({"x":120.0,"y":250.0,"delta":delta}));
              h.frames(8);
          }
          let final_y = h.widget(&action).expect("repair widget after scroll")[1];
          assert!((207.0..=291.0).contains(&final_y), "T155b repair button could not be scrolled into visible browser clip: y={final_y}");
          h.step(&serde_json::json!({"widget":action})).unwrap();
          eprintln!("T155b HARNESS after_click review={} repair_button={}", h.widget("Review repair").is_some(), h.widget(&format!("Repair {id}")).is_some());''',1)
          p.write_text(s)
          p=Path('crates/ui-egui/src/scenario.rs')
          s=p.read_text()
          a='                self.call("ui.click", json!({"x": x, "y": y}))'
          assert s.count(a)==1
          s=s.replace(a,'''                eprintln!("T155b SCENARIO click widget={} target=({x:.2},{y:.2})", text);
          self.call("ui.click", json!({"x": x, "y": y}))''',1)
          p.write_text(s)
          print("T155b injection OK")
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq >/tmp/apt.log 2>&1
          sudo apt-get install -y -qq libgl1-mesa-dri libegl1 libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev >>/tmp/apt.log 2>&1 || { tail -n 60 /tmp/apt.log; exit 1; }
      - name: Run focused pointer diagnostic
        run: |
          set +e
          cargo test --locked -q -p solidcraft-ui-egui repair_lost_bore_through_visible_buttons_review_confirm_and_undo -- --nocapture > /tmp/test.log 2>&1
          rc=$?
          echo "TEST_EXIT_CODE=$rc"
          grep -E 'T155b |panicked at|repair panel opens|test result:|^error' /tmp/test.log | tail -n 100 || true
          tail -n 22 /tmp/test.log
          exit "$rc"
      - name: Disk
        if: always()
        run: df -h .
