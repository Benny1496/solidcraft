name: SolidCraft Stage 4 Followup Test 133 Sheet UI Integration
on:
  push:
    branches:
      - tests/solidcraft-t133-sheet-page-integration
permissions:
  contents: read
jobs:
  native-sheet-ui-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: drawings-t133-sheet-page-merge
      - name: Verify exact official drawings base and capture Loohi PR head
        run: |
          set -euo pipefail
          mkdir -p t133-report
          BASE=261f0d37aa85611231b6f5f3f175d243fdc53631
          LOOHI=84ef88b10e394c9ea9f90459c242e2033c6f7133
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD:crates/ui-egui/src/drawing_workspace.rs)" = "$(git rev-parse "$BASE":crates/ui-egui/src/drawing_workspace.rs)"
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git pull/13211/head
          test "$(git rev-parse FETCH_HEAD)" = "$LOOHI"
          echo "T133_BASE_VERIFIED drawings=$BASE loohi_pr13211=$LOOHI checkout_unmodified=true" | tee t133-report/source.txt
          git log -1 --format='%H %s' FETCH_HEAD | tee -a t133-report/source.txt
      - name: Merge Loohi in disposable runner and reconcile seven documented interfaces
        run: |
          set -euo pipefail
          git config user.name "SolidCraft integration test"
          git config user.email "solidcraft-integration@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff FETCH_HEAD > t133-report/merge.log 2>&1
          code=$?
          set -e
          cat t133-report/merge.log
          if [ "$code" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee t133-report/conflicts.txt
            git status --short > t133-report/merge-status.txt
            python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("t133-report/reconciliation.txt")
          paths = Path("t133-report/conflicts.txt").read_text().splitlines()
          expected = {
              "crates/engine/src/cmd/view_navigation.rs": 1,
              "crates/ui-egui/src/colour_tokens_tests.rs": 1,
              "crates/ui-egui/src/control.rs": 1,
              "crates/ui-egui/src/drawing_workspace.rs": 2,
              "crates/ui-egui/src/theme.rs": 1,
              "crates/ui-kit/src/navigation_bar.rs": 1,
              "docs/control-protocol.md": 1,
          }
          if set(paths) != set(expected):
              raise RuntimeError(f"conflict inventory changed: {paths!r}")
          pat = re.compile(r"^<<<<<<< [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n", re.M | re.S)
          actions = []
          for name in paths:
              file = Path(name)
              source = file.read_text()
              matches = list(pat.finditer(source))
              if len(matches) != expected[name]:
                  raise RuntimeError(f"{name}: {len(matches)} hunks instead of expected {expected[name]}")
              index = 0
              def reconcile(match):
                  global index
                  ours, theirs = match.group(1), match.group(2)
                  i = index
                  index += 1
                  if name.endswith("view_navigation.rs"):
                      assert "view.tool.zoom" in ours and ".any_part()" in theirs
                      value = ours
                      fit = '.icon("fit").key("F6").noundo().doc_only().params('
                      assert value.count(fit) == 1, "Fit command starts before the conflict hunk"
                      value = value.replace(fit, '.icon("fit").key("F6").noundo().doc_only().any_part().params(', 1)
                      for command in ("home", "tool"):
                          marker = f'CommandSpec::new("view.{command}"'
                          pos = value.index(marker)
                          next_pos = value.find("CommandSpec::new(", pos + 1)
                          if next_pos == -1:
                              next_pos = len(value)
                          chunk = value[pos:next_pos]
                          assert ".noundo().doc_only().params(" in chunk
                          chunk = chunk.replace(".noundo().doc_only().params(", ".noundo().doc_only().any_part().params(", 1)
                          value = value[:pos] + chunk + value[next_pos:]
                      actions.append("view_navigation: retain new Zoom Tool and allow Fit/Home/Tool with drawing")
                      return value
                  if name.endswith("colour_tokens_tests.rs"):
                      assert "icons/navigation.rs" in ours and "drawing_sheet_page.rs" in theirs
                      actions.append("colour_tokens: keep modern icon path and include drawing-page literals")
                      return ours + '    ("drawing_sheet_page.rs", 2, "drawing sheet background contrast"),\n'
                  if name.endswith("control.rs"):
                      assert '"ui.inspect" => ui_inspect(app)' in ours and '"sheet_page": crate::drawing_sheet_page::inspect(app)' in theirs
                      actions.append("control: retain modern ui_inspect/ui_view dispatch; port drawing into helpers")
                      return ours
                  if name.endswith("drawing_workspace.rs"):
                      if i == 0:
                          assert "solidcraft_ui_text::tr_label" in ours and "ui.sheet_page.no_drawing" in theirs
                          actions.append("workspace: preserve current localization in fallback")
                          return ours
                      assert "drawing_sheet_page::colour_choice" in theirs
                      actions.append("workspace: activate paper-colour selector")
                      return '        ui.heading(solidcraft_ui_text::tr_label("Screen appearance"));\n        let label = solidcraft_ui_text::tr_label("Paper colour");\n        ui_kit::row(ui, label, |ui| crate::drawing_sheet_page::colour_choice(app, ui));\n'
                  if name.endswith("theme.rs"):
                      assert "pub fn srgb" in theirs or "pub struct IconColors" in theirs
                      actions.append("theme: preserve modern split theme crate; no legacy Tokens resurrected")
                      return ours
                  if name.endswith("navigation_bar.rs"):
                      assert "needs_orbit" in ours and "NavCaps" in theirs
                      actions.append("navigation: retain modern shared ui-kit slot API")
                      return ours
                  if name.endswith("control-protocol.md"):
                      assert "Recover unsaved design?" in ours and "sheet_page" in theirs
                      actions.append("control-protocol: retain recovery docs and add sheet-page response")
                      addition = ' In Drawing, sheet_page reports zoom, sheet size, colour, view status and hovered paper object.'
                      assert ours.rstrip().endswith("|")
                      return ours.rstrip()[:-1].rstrip() + addition + " |\n"
                  raise AssertionError(name)
              result = pat.sub(reconcile, source)
              if pat.search(result) or "<<<<<<<" in result or ">>>>>>>" in result:
                  raise RuntimeError(f"remaining conflict markers in {name}")
              file.write_text(result)
          control = Path("crates/ui-egui/src/control.rs")
          contents = control.read_text()
          def replace_once(before, after):
              global contents
              if contents.count(before) != 1:
                  raise RuntimeError(f"unexpected control.rs structure {before!r}: {contents.count(before)}")
              contents = contents.replace(before, after, 1)
          replace_once(
              'fn ui_inspect(app: &SolveApp) -> Outcome {\n    ok(json!({\n        "render": crate::render_workspace::inspect_state(app),',
              'fn ui_inspect(app: &SolveApp) -> Outcome {\n    ok(json!({\n        "render": crate::render_workspace::inspect_state(app),\n        "sheet_page": crate::drawing_sheet_page::inspect(app),'
          )
          replace_once('"ui.view" => with(p, |q| ui_view(app, q)),', '"ui.view" => with(p, |q| ui_view(app, q, ctx)),')
          replace_once('fn ui_view(app: &mut SolveApp, q: params::View) -> Outcome {', 'fn ui_view(app: &mut SolveApp, q: params::View, ctx: &egui::Context) -> Outcome {')
          replace_once(
              '        return err("Drawing has no sheet renderer or camera yet");',
              '''        match v {
                      "fit" | "home" => crate::drawing_sheet_page::fit(app),
                      "actual_size" => crate::drawing_sheet_page::actual_size(app, ctx),
                      other => return err(format!("drawing sheet view {other} not available: fit, home or actual_size")),
                  }
                  return ok(json!({"sheet_page": true}));'''
          )
          control.write_text(contents)
          actions.append("control: modern ui_inspect and ui_view accept sheet_page and drawing navigation")
          log.write_text("\n".join(actions) + "\n")
          for action in actions:
              print("T133_RECONCILED", action)
          PY
            while IFS= read -r f; do git add "$f"; done < t133-report/conflicts.txt
            if git ls-files -u | grep -q .; then
              echo "T133_UNRESOLVED_INDEX"
              exit 44
            fi
          fi
          git diff --check
          git diff --cached --check
          echo "T133_MERGE_RECONCILED seven_conflict_files=handled only_in_ci=true" | tee -a t133-report/merge.log
          git status --short > t133-report/merge-status.txt
      - name: Apply known Note enum compatibility arm only in the CI checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("crates/ui-egui/src/drawing_sheet_page.rs")
          text = target.read_text()
          added = 'ObjectKind::Note => "note",'
          if added in text:
              print("T133_NOTE_ARM already_present=true")
          else:
              needle = '        ObjectKind::Dimension => "dimension",'
              assert text.count(needle) == 1, "unexpected kind_name layout: do not guess a repair"
              text = text.replace(needle, needle + "\n        " + added)
              target.write_text(text)
              print("T133_NOTE_ARM ci_only_fix=true source_original_untouched=true")
          assert added in target.read_text()
          PY
          git diff --check
      - name: Port the eight paper palette fields into shared Tokens only in CI checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("crates/theme/src/lib.rs")
          palette = Path("crates/theme/src/palettes.rs")
          source = target.read_text()
          palette_source = palette.read_text()
          fields = (
              "paper_white", "paper_ink",
              "paper_blueprint", "paper_blueprint_ink",
              "paper_prussian_blue", "paper_prussian_blue_ink",
              "paper_dark", "paper_dark_ink",
          )
          for field in fields:
              assert palette_source.count(f"            {field}:") == 1, f"unexpected Loohi palette field: {field}"
              assert f"pub {field}: Color32" not in source, f"new upstream field requires manual review: {field}"
          anchor = "    pub bend_down: Color32,\n"
          assert source.count(anchor) == 1, "current Tokens struct has moved: avoid guessing"
          addition = "    /// On-screen Drawing sheet and ink palettes; original print/export stays unchanged.\n"
          addition += "".join(f"    pub {name}: Color32,\n" for name in fields)
          target.write_text(source.replace(anchor, anchor + addition, 1))
          assert all(target.read_text().count(f"    pub {field}: Color32,") == 1 for field in fields)
          Path("t133-report/theme-token-port.txt").write_text(
              "T133_THEME_PORT=8_current_shared_Tokens_fields\n"
              + "\n".join(fields) + "\nsource_original=unchanged\n"
          )
          print("T133_THEME_PORT_PASS fields=8 only_in_disposable_runner=true")
          PY
          git diff --check
      - name: Build and run real sheet UI, workspace and navigation tests
        run: |
          set -euo pipefail
          {
            echo "T133_PHASE=compile_ui_actual_integration"
            timeout 135m cargo check -p solidcraft-ui-egui --profile ci
            echo "T133_PHASE=sheet_page_real_ui_tests"
            timeout 135m cargo test -p solidcraft-ui-egui --lib --profile ci drawing_sheet_page -- --nocapture
            echo "T133_PHASE=workspace_ui_tests"
            timeout 135m cargo test -p solidcraft-ui-egui --lib --profile ci drawing_workspace -- --nocapture
            echo "T133_PHASE=navigation_with_open_drawing"
            timeout 135m cargo test -p solidcraft-engine --lib --profile ci sheet_navigation_runs_with_a_drawing_open -- --nocapture
            echo "T133_SHEET_UI_INTEGRATION_PASS merge=clean note_arm=handled real_ui_tests=executed"
          } 2>&1 | tee t133-report/result.log
      - name: Preserve exact original CI integration and conflict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t133-sheet-ui-integration-evidence
          path: t133-report/
          retention-days: 30
