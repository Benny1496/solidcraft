name: "SolidCraft Test 84: PR 11881 rebased onto drawings 1b069e1 with its views test, alone and with PR 8288 (fork only)"

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-pr11881-views-84.yml
      - tests/fixtures/t84/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-pr11881-views-84
  cancel-in-progress: false

env:
  BASE_SHA: 1b069e1a33fe0c264925558f5b984701fee9c28f
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  proto:
    name: "Test 84 - on drawings@1b069e1, ${{ matrix.tree }}: repository checks, clippy, the prototypes, all engine tests, known-failing"
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tree: [pr11881-alone, pr11881-with-pr8288]
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
      ACTION_MATRIX_JOBS: "4"
    steps:
      - name: Make room on the runner
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Checkout the patches (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout drawings at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangency-labs/solidcraft
          ref: 1b069e1a33fe0c264925558f5b984701fee9c28f
          path: src
          persist-credentials: false
      - name: Apply PR 11881 rebased onto 1b069e1 with the views test, and PR 8288 (a1b4ed2) in the second job
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --index ../overlay/tests/fixtures/t84/pr11881-on-1b069e1.diff
          if [ "${{ matrix.tree }}" = "pr11881-with-pr8288" ]; then git apply --index ../overlay/tests/fixtures/t84/pr8288-a1b4ed2.diff; fi
          git diff --cached --stat
          echo "T84_APPLIED=PASS (${{ matrix.tree }})"
      - name: Install a software Vulkan driver (lavapipe), as the upstream test job does
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: t84-${{ matrix.tree }}
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Repository checks, as the upstream "Format and repository checks" job runs them
        shell: bash
        working-directory: src
        run: |
          set -uo pipefail
          mkdir -p ../t84-report
          fails=0
          check() {
            local name="$1"; shift
            if "$@" > "../t84-report/check-${name}.log" 2>&1; then
              echo "T84_CHECK ${name}: PASS"
            else
              echo "T84_CHECK ${name}: FAIL"; tail -40 "../t84-report/check-${name}.log"; fails=$((fails + 1))
            fi
          }
          check fmt cargo fmt --all -- --check
          check assets cargo xtask assets
          check icons cargo xtask icons
          check licences cargo xtask licences --check
          check layers cargo xtask layers
          check ui-containers bash -c 'cargo xtask ui-containers && cargo test -p xtask ui_containers --locked'
          check lists cargo xtask lists
          check i18n cargo xtask i18n --check
          check skills bash -c 'cargo xtask skills && cargo test -p xtask skills --locked'
          check format-pending bash scripts/test-format-pending.sh
          check web-offline cargo xtask web-offline-test
          check affected-selftest python3 -I scripts/ci/test_affected.py
          check main-merge-selftest python3 -I scripts/ci/test_main_merge.py
          check bot-tests bash -c 'node --test scripts/claim/*.test.js scripts/triage/*.test.js scripts/kernel-paused/*.test.js scripts/pr-checks/*.test.js'
          if [ -f tests/fixtures/w23-assembly-sheet/validate.py ]; then check w23-assembly-static python3 -I tests/fixtures/w23-assembly-sheet/validate.py; fi
          if [ -f tests/fixtures/w23a-drawing-updates/validate.py ]; then check w23a-static python3 -I tests/fixtures/w23a-drawing-updates/validate.py; fi
          echo "T84_CHECKS_FAILED=${fails}"
          test "$fails" = 0
      - name: Clippy -D warnings on the engine, all targets
        if: always()
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          timeout 120m cargo clippy -p solidcraft-engine --all-targets --profile ci --locked -- -D warnings 2>&1 | tee ../t84-report/clippy.log
          test "${PIPESTATUS[0]}" = 0
          echo "T84_CLIPPY_ENGINE=PASS"
      - name: The prototype first, with its output, as annotations
        if: always()
        shell: bash
        working-directory: src
        run: |
          set +e
          set -uo pipefail
          timeout 120m cargo nextest run -p solidcraft-engine --cargo-profile ci --locked --no-capture --no-fail-fast --no-tests=fail \
            -E 'test(=cmd::drawing_view::tests::the_assembly_sheets_views_keep_what_they_show_through_the_model)' \
            > ../t84-report/prototypes.log 2>&1
          status=$?
          echo "T84_PROTOTYPES_EXIT=$status"
          python3 - <<'PY'
          from pathlib import Path
          log = Path("../t84-report/prototypes.log").read_text(errors="replace").replace("\r", "")
          esc = lambda t: t.replace("%", "%25").replace("\n", "%0A")
          for line in log.splitlines():
              if "T84_OBSERVE" in line:
                  print("::notice title=observed::" + esc(line[line.find("T84_OBSERVE"):][:3000]))
              if " PASS [" in line or " FAIL [" in line or "Summary [" in line:
                  print("::notice title=prototype result::" + esc(line.strip()))
          at = 0
          while (at := log.find("panicked at", at)) >= 0:
              start = log.rfind("thread '", 0, at)
              print("::error title=prototype panic::" + esc(log[start if start >= 0 else at:at + 1500]))
              at += 11
          PY
          tail -60 ../t84-report/prototypes.log
      - name: All engine tests as CI runs them, then known-failing grades the run
        if: always()
        shell: bash
        working-directory: src
        run: |
          set +e
          set -uo pipefail
          base='default() & not (binary(action_matrix) & test(=action_matrix_sample))'
          timeout 230m cargo nextest run -p solidcraft-engine --cargo-profile ci --locked --profile ci --no-tests=pass \
            --ignore-default-filter -E "($base) & not (package(=solidcraft-gpu) & test(/^path::/))" 2>&1 | tee ../t84-report/engine-tests.log
          status=${PIPESTATUS[0]}
          cp target/nextest/ci/junit.xml ../t84-report/engine-junit.xml 2>/dev/null
          grep -E "Summary \[" ../t84-report/engine-tests.log | sed 's/^/T84_SUMMARY /'
          grep -E "^\s+(FAIL|SIGSEGV|SIGABRT|TIMEOUT) " ../t84-report/engine-tests.log | sort -u | sed 's/^/T84_NOT_PASSED /' | head -40
          echo "T84_NEXTEST_EXIT=$status (0 all passed, 100 some failed)"
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("../t84-report/engine-tests.log").read_text(errors="replace")
          ours = {
              "cmd::bom::tests": ["the_assembly_sheets_parts_list_matches_the_hand_counts", "the_assembly_sheets_item_numbers_hold_through_edits_undo_and_reopening", "a_purchased_screw_keeps_the_assembly_sheets_counts", "a_phantom_holder_puts_what_it_holds_on_the_assembly_sheets_first_level"],
              "cmd::drawing_balloon::tests": ["balloons_on_the_assembly_sheet_follow_the_model_and_its_revision_rows_stay", "balloons_on_the_assembly_sheet_read_their_holders_row"],
              "cmd::drawing_view::tests": ["the_assembly_sheets_views_keep_what_they_show_through_the_model"],
              "cmd::drawing_table::tests": ["the_assembly_sheet_keeps_its_parts_list_revisions_and_tag_through_the_model"],
              "cmd::drawing_dimension::tests": ["changing_a_bores_diameter_keeps_its_dimension", "deleting_a_bore_loses_its_dimension_and_never_moves_it", "undo_and_redo_a_diameter_change_keep_its_dimension", "undo_and_redo_a_deleted_bore_restore_its_dimension", "reopening_a_plate_keeps_dimensions_and_a_lost_bores_last_value", "the_plates_width_between_its_side_faces_follows_a_width_change", "a_suppressed_bore_says_so_and_its_dimension_comes_back", "the_plates_five_dimensions_follow_each_parameter_and_its_undo", "the_bores_centres_stay_put_and_a_lost_bore_takes_its_centre_dimensions", "the_plates_sheet_draws_what_the_model_has_and_the_same_after_undo", "fillets_on_the_plates_corners_leave_its_five_dimensions_read", "a_new_hole_never_takes_the_dimension_of_an_undone_one", "a_rounded_bore_rim_is_lost_and_a_repair_reads_it_again", "a_deleted_bores_dimension_reads_bore2_only_when_repaired_to_it", "renaming_the_plate_keeps_its_five_dimensions"],
          }
          for module, names in ours.items():
              for name in names:
                  full = f"{module}::{name}"
                  m = re.search(r"^\s+(PASS|FAIL|SIGSEGV|SIGABRT|TIMEOUT) \[[^\]]*\] (?:\([^)]*\) )?solidcraft-engine " + re.escape(full) + r"$", log, re.M)
                  verdict = m.group(1) if m else "MISSING"
                  print(f"T84_OURS {full}: {verdict}")
                  if "drawing_dimension" in module and "${{ matrix.tree }}" != "pr11881-with-pr8288":
                      continue
                  expected_fail = name in ("a_new_hole_never_takes_the_dimension_of_an_undone_one", "renaming_the_plate_keeps_its_five_dimensions")
                  if (verdict != "PASS") != expected_fail or verdict not in ("PASS", "FAIL"):
                      at = log.find(f"thread '{full}'")
                      why = log[at:at + 1500] if at >= 0 else "no panic text found"
                      print(f"::error title={name}::" + why.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit target/nextest/ci/junit.xml 2>&1 | tee ../t84-report/known-failing.log
          kf=${PIPESTATUS[0]}
          echo "T84_KNOWN_FAILING_EXIT=$kf"
          test "$kf" = 0 && echo "T84_ENGINE_TESTS_AS_CI=PASS"
          test "$kf" = 0
      - name: Preserve original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t84-${{ matrix.tree }}
          path: t84-report/
          if-no-files-found: warn
          retention-days: 14
