name: SolidCraft Test 196 - isolated repair integration
on:
  push:
    branches:
      - tests/solidcraft-t194
    paths:
      - '.github/workflows/solidcraft-t196.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t196"
          cp -r tests/fixtures/t196 "$RUNNER_TEMP/t196-fixtures"
          cp tests/fixtures/t196-gui.py "$RUNNER_TEMP/t196-gui.py"
          cp tests/fixtures/t196-instrumented-repair.rs "$RUNNER_TEMP/t196-instrumented-repair.rs"
          cp tests/fixtures/t196-instrumented-workspace.rs "$RUNNER_TEMP/t196-instrumented-workspace.rs"
          git fetch --no-tags https://github.com/Benny1496/solidcraft.git 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          base=$(git merge-base 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 cc5acc82b9cb8fcbc624537b14d18c58efd6321f)
          test "$base" = f1cc6e70f9337bc940ecc27d2f1d31438df36ce2
          git diff --binary "$base" 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 -- . ':!crates/ui-egui/src/drawing_workspace.rs' > "$RUNNER_TEMP/t196/original.patch"
          git switch --detach cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          test "$(git rev-parse HEAD)" = cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          git apply --3way --index "$RUNNER_TEMP/t196/original.patch"
          cp -r "$RUNNER_TEMP/t196-fixtures/." .
          git add assets/locales/pending attribution/pending crates/ui-egui/src
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/t196/integration.patch"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libwayland-dev libasound2-dev pkg-config xvfb xauth dbus-x11 at-spi2-core python3-pyatspi libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dri openbox
      - name: Verify runtime libraries before build
        run: |
          python3 -c 'import ctypes; ctypes.CDLL("libxkbcommon-x11.so"); ctypes.CDLL("libxkbcommon-x11.so.0")'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: solidcraft-native-ubuntu24-rust1991-cc5acc82-t194-v1
          restore-keys: |
            solidcraft-native-ubuntu24-rust1991-cc5acc82-
      - name: Format and build native application
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/t196"
          cp "$RUNNER_TEMP/t196-instrumented-repair.rs" crates/ui-egui/src/drawing_repair_ui.rs
          cp "$RUNNER_TEMP/t196-instrumented-workspace.rs" crates/ui-egui/src/drawing_workspace.rs
          cargo fmt --all
          cargo fmt --all -- --check
          git diff HEAD --binary > "$report/formatted.patch"
          cargo build --release --locked -p solidcraft 2>&1 | tee "$report/build.txt"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: solidcraft-native-ubuntu24-rust1991-cc5acc82-t194-v1
      - name: Native GUI through official control channel
        shell: bash
        run: |
          set -euo pipefail
          export REPORT="$RUNNER_TEMP/t196"
          export CONTROL_PORT=7878
          export SOLIDCRAFT_CONTROL_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$SOLIDCRAFT_CONTROL_TOKEN"
          export DISPLAY=:99
          export XDG_CONFIG_HOME="$RUNNER_TEMP/t196-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/t196-data"
          export LANG=C.UTF-8
          export LIBGL_ALWAYS_SOFTWARE=1
          export RUST_BACKTRACE=1
          export GTK_MODULES=gail:atk-bridge
          export NO_AT_BRIDGE=0
          export CARGO_TARGET_DIR="$PWD/target"
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > "$REPORT/xvfb.txt" 2>&1 &
          trap 'jobs -pr | xargs -r kill' EXIT
          sleep 2
          dbus-run-session -- bash -c '
            set -eo pipefail
            openbox > "$REPORT/wm.txt" 2>&1 &
            /usr/libexec/at-spi-bus-launcher --launch-immediately > "$REPORT/atspi.txt" 2>&1 &
            "$CARGO_TARGET_DIR/release/solidcraft" --control "$CONTROL_PORT" > "$REPORT/app.txt" 2>&1 &
            app=$!
            export APP_PID="$app"
            trap "kill $app 2>/dev/null || true" EXIT
            /usr/bin/python3 "$RUNNER_TEMP/t196-gui.py" 2>&1 | tee "$REPORT/gui.txt"
            exit ${PIPESTATUS[0]}
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T196-integration
          path: ${{ runner.temp }}/t196/
