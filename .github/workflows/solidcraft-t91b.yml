name: "SolidCraft Test 91b - audit original engine results and run missing docs"
on:
  push:
    branches:
      - tests/solidcraft-t91b
    paths:
      - .github/workflows/solidcraft-t91b.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: solidcraft-test91b-reaudit-docs
  cancel-in-progress: false

jobs:
  original-engine-re-audit:
    name: "T91b re-audit original 3772 test outcomes, no rerun"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_SHA256: "d88256f4230f460ef0379cf31fdb1ae60f625475e33916383e54d4d5df31f5d8"
      PINNED_HEAD: "e571b8998e6217787a92a25ceb565ece736ebf2d"
    steps:
      - name: Guard isolated fork and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$GITHUB_REF_NAME" = "tests/solidcraft-t91b"

      - name: Checkout isolated audit script
        uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout exact PR11881 commit to read authoritative baseline
        uses: actions/checkout@v4
        with:
          repository: Benny1496/solidcraft
          ref: e571b8998e6217787a92a25ceb565ece736ebf2d
          path: src
          persist-credentials: false

      - name: Fetch ORIGINAL T91 engine artifact ZIP and verify its GitHub SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t91b-audit-report/original
          test "$(git -C src rev-parse HEAD)" = "$PINNED_HEAD"
          archive=t91b-audit-report/original-engine.zip
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Benny1496/solidcraft/actions/artifacts/13549116265/zip" \
            -o "$archive"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual" = "$ORIGINAL_SHA256" || {
            echo "::error::Original T91 ZIP SHA mismatch - refusing unverified evidence"
            exit 1
          }
          test "$(stat -c %s "$archive")" = 166666
          unzip -q "$archive" -d t91b-audit-report/original
          for f in engine-all-tests.log engine-tests-list.txt engine-evaluation.json; do
            test -s "t91b-audit-report/original/$f"
          done
          printf "ORIGINAL_RUN=42304157430\nORIGINAL_ARTIFACT_ID=13549116265\nORIGINAL_ZIP_SHA256=%s\nORIGINAL_ZIP_VERIFIED=PASS\n" "$actual" | tee t91b-audit-report/summary.txt
          sha256sum t91b-audit-report/original/engine-{all-tests.log,tests-list.txt,evaluation.json} > t91b-audit-report/extracted-evidence-sha256.txt

      - name: Re-audit all original Rust test outcomes with reason-aware ignored parser
        shell: bash
        run: |
          set -euo pipefail
          python3 overlay/tests/fixtures/t91b/audit_original_t91.py \
            t91b-audit-report/original src t91b-audit-report \
            | tee t91b-audit-report/audit.log
          grep -F 'FINAL=T91B_ENGINE_REAUDIT_BASELINE_VERIFIED_0_NEW_REGRESSIONS' t91b-audit-report/audit.log
          echo 'FINAL=T91B_ORIGINAL_ENGINE_REAUDIT_PASS' | tee -a t91b-audit-report/summary.txt
          echo 'Re-audit of unchanged original Test #91 logs; 3772 unit tests were NOT re-executed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit with original evidence logs, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t91b-engine-re-audit
          path: |
            t91b-audit-report/summary.txt
            t91b-audit-report/audit.log
            t91b-audit-report/t91b-engine-audit.json
            t91b-audit-report/t91b-ignored-tests.txt
            t91b-audit-report/extracted-evidence-sha256.txt
          retention-days: 14
          if-no-files-found: warn

  missing-engine-docs:
    name: "T91b run only missing Rust engine documentation tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PINNED_HEAD: "e571b8998e6217787a92a25ceb565ece736ebf2d"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Guard isolated fork and branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$GITHUB_REF_NAME" = "tests/solidcraft-t91b"

      - name: Checkout exact PR11881 commit read-only
        uses: actions/checkout@v4
        with:
          repository: Benny1496/solidcraft
          ref: e571b8998e6217787a92a25ceb565ece736ebf2d
          path: src
          persist-credentials: false

      - name: Verify pinned PR SHA and prepare report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t91b-doc-report
          test "$(git -C src rev-parse HEAD)" = "$PINNED_HEAD"
          printf "TEST=91b\nSOURCE_PR=11881\nPR_SHA=%s\nTRACK=DOC_TESTS_ONLY\n" "$PINNED_HEAD" | tee t91b-doc-report/summary.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: t91-full-engine
          cache-on-failure: true

      - name: Run ONLY pending engine doctests (no unit suite rerun)
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          echo "ENGINE_DOC_TESTS=STARTED" >> ../t91b-doc-report/summary.txt
          if timeout 75m cargo test --doc -p solidcraft-engine --profile ci --locked -- --test-threads=2 > ../t91b-doc-report/doc-tests.log 2>&1; then
            echo "FINAL=T91B_ENGINE_DOC_TESTS_PASS" | tee -a ../t91b-doc-report/summary.txt
            tail -65 ../t91b-doc-report/doc-tests.log
          else
            rc="$?"
            printf "FINAL=T91B_ENGINE_DOC_TESTS_FAILED\nEXIT_CODE=%s\n" "$rc" | tee -a ../t91b-doc-report/summary.txt
            tail -120 ../t91b-doc-report/doc-tests.log
            exit "$rc"
          fi

      - name: Upload original doc test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t91b-engine-doc-tests
          path: t91b-doc-report/
          retention-days: 14
          if-no-files-found: warn
