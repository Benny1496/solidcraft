name: SolidCraft Test 158 real GUI repair acceptance
on:
  push:
    branches: [tests/solidcraft-t158-real-gui-acceptance]
    paths: ['.github/workflows/solidcraft-t158-real-gui-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest drawings and use its panel architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SolidCraft CI"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream drawings
          echo "UPSTREAM_DRAWINGS_SHA=$(git rev-parse FETCH_HEAD)"
          git merge --no-commit --no-ff -X ours FETCH_HEAD > /tmp/merge.log 2>&1 || { tail -n 80 /tmp/merge.log; exit 1; }
          git show FETCH_HEAD:crates/ui-egui/src/drawing_workspace.rs > /tmp/upstream_drawing_workspace.rs
          git show HEAD:crates/ui-egui/src/drawing_workspace.rs > /tmp/repair_drawing_workspace.rs
          python3 - <<'PY'
          from pathlib import Path
          import re
          new=Path('/tmp/upstream_drawing_workspace.rs').read_text()
          old=Path('/tmp/repair_drawing_workspace.rs').read_text()
          fields=old.split('    status_revision: Option<u64>,',1)[1].split('\n}',1)[0]
          fields='    status_revision: Option<u64>,'+fields
          anchor='    pub(crate) page: crate::drawing_sheet_page::Page,'
          assert new.count(anchor)==1
          new=new.replace(anchor,anchor+'\n'+fields,1)
          helpers=old.split('pub(crate) fn invalidate_status(app: &mut SolveApp) {',1)[1].split('pub fn active(app: &SolveApp)',1)[0]
          new=new.replace('pub fn active(app: &SolveApp)', 'pub(crate) fn invalidate_status(app: &mut SolveApp) {'+helpers+'pub fn active(app: &SolveApp)',1)
          # Keep the new upstream browser/inspector APIs, scroll host and panels module intact.
          anchor='fn browser_rows(app: &mut SolveApp, ui: &mut egui::Ui) {'
          assert new.count(anchor)==1
          insertion='''fn browser_rows(app: &mut SolveApp, ui: &mut egui::Ui) {
              refresh_status_if_needed(app);
              ui.push_id("drawing_attention_status", |ui| {
                  if let Some(snapshot) = app.drawing_workspace.status_controller.snapshot() {
                      if snapshot.dimensions.iter().any(|dim| dim.status == "lost" || dim.status == "ambiguous") {
                          crate::drawing_attention_card::show(ui, &snapshot);
                          let repaired = crate::drawing_repair_ui::show(ui, &mut app.session, &mut app.drawing_workspace.repair_ui, &snapshot);
                          if repaired { invalidate_status(app); }
                      }
                  }
              });
          '''
          # Avoid guessing status snapshot shape: use exact old rendering logic instead.
          old_browser=old.split('pub(crate) fn browser_contents(app: &mut SolveApp, ui: &mut egui::Ui) {',1)[1]
          status=old_browser.split('    refresh_status_if_needed(app);',1)[1].split('    if let Ok(drawing)',1)[0]
          status='    refresh_status_if_needed(app);'+status
          new=new.replace(anchor,anchor+'\n'+status,1)
          # Keep status lifecycle active on sheet page.
          show='pub fn show(app: &mut SolveApp, ui: &mut egui::Ui) {'
          assert new.count(show)==1
          new=new.replace(show,show+'\n    refresh_status_if_needed(app);',1)
          required=['fn inspector_contents','fn inspector_visible','fn sheets_visible','mod panels;','ScrollArea::vertical','drawing_repair_ui::show','fn refresh_status_if_needed']
          for token in required: assert token in new, token
          Path('crates/ui-egui/src/drawing_workspace.rs').write_text(new)
          print('T158: upstream panel APIs preserved; repair status UI transplanted into browser scroll contents')
          PY
          git diff --check
      - name: Compile updated panel and repair integration
        run: |
          set -o pipefail
          cargo check --locked -q -p solidcraft-ui-egui 2>&1 | tee /tmp/t158-check.log
      - name: Restore isolated GUI acceptance test from original repair branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/repair_drawing_workspace.rs').read_text()
          target=Path('crates/ui-egui/src/drawing_workspace.rs')
          name='fn repair_lost_bore_through_visible_buttons_review_confirm_and_undo() {'
          assert src.count(name)==1, 'GUI test not uniquely found in repair source'
          start=src.index(name)
          brace=src.index('{',start)
          depth=1
          end=brace+1
          while depth:
              if src[end]=='{': depth+=1
              elif src[end]=='}': depth-=1
              end+=1
          test=src[start:end]
          assert 'Confirm repair' in test and 'edit.undo' in test
          with target.open('a') as f:
              f.write('\n#[cfg(test)]\nmod repair_gui_acceptance_t158 {\n    use super::*;\n    use crate::scenario::Harness;\n    #[test]\n')
              f.write(test)
              f.write('\n}\n')
          print('T158 restored actual mouse-driven GUI test as separate module')
          PY
      - name: Verify test discovery and run exact GUI test
        run: |
          set -euo pipefail
          cargo test --locked -q -p solidcraft-ui-egui --lib -- --list > /tmp/t158-list.log
          grep -F 'drawing_workspace::repair_gui_acceptance_t158::repair_lost_bore_through_visible_buttons_review_confirm_and_undo: test' /tmp/t158-list.log
          echo "T158 GUI test discovered; running it now"
          cargo test --locked -p solidcraft-ui-egui --lib drawing_workspace::repair_gui_acceptance_t158::repair_lost_bore_through_visible_buttons_review_confirm_and_undo -- --exact --nocapture 2>&1 | tee /tmp/t158-test.log
          grep -E 'test result: ok\. 1 passed; 0 failed' /tmp/t158-test.log
      - name: Print focused diagnostic on failure
        if: failure()
        run: |
          grep -E 'error\[|error:|panicked at|test result:|T158|assertion failed' /tmp/t158-check.log /tmp/t158-test.log 2>/dev/null | tail -n 90 || true
