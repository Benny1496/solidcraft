name: SolidCraft PR 8288 rebased onto drawings 49eedf1 with the radial fix, Test 66 (fork only)

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-pr8288-rebased-66.yml
      - tests/fixtures/pr8288-rebased-t66/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-pr8288-rebased-66
  cancel-in-progress: false

jobs:
  pretest:
    name: Test 66 ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PR 8288 rebased with its two new tests on drawings@49eedf1 plus #11953
            repo: tangency-labs/solidcraft
            base: 49eedf122ca01d94390c8779e1adf5cb1a911fab
            prototypes: "yes"
            expect_new: "7"
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout the patches (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.base }}
          path: src
          persist-credentials: false
      - name: Apply PR 8288's two commits (and the prototypes)
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "${{ matrix.base }}"
          git apply --index ../overlay/tests/fixtures/pr8288-rebased-t66/fix11953.diff
          echo "T66_FIX_11953_APPLIED=PASS (one radial helper)"
          git apply --index ../overlay/tests/fixtures/pr8288-rebased-t66/pr8288-on-49eedf1.diff
          echo "T66_PR8288_REBASED_APPLIED=PASS"
          ! grep -n "unreachable!" crates/engine/src/cmd/drawing_dimension_tests.rs
          git diff --cached --stat
          python3 -I tests/fixtures/w23a-drawing-updates/validate.py
          echo "T66_W23A_STATIC=PASS"
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          cache-on-failure: true
      - name: fmt and clippy -D warnings on the engine
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/engine/src/cmd/drawing_dimension_tests.rs
          echo "T66_FMT=PASS"
          timeout 100m cargo clippy -p solidcraft-engine --all-targets --profile ci -- -D warnings
          echo "T66_CLIPPY=PASS"
      - name: Run the drawing dimension tests
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../test66-report
          set +e
          timeout 60m cargo test --profile ci -p solidcraft-engine --lib cmd::drawing_dimension::tests -- --test-threads=2 2>&1 | tee ../test66-report/dimension.log
          code=${PIPESTATUS[0]}
          set -e
          python3 - "${{ matrix.prototypes }}" "${{ matrix.expect_new }}" <<'PY'
          import re
          import sys
          from pathlib import Path
          prototypes, expect = sys.argv[1] == "yes", int(sys.argv[2])
          text = Path("../test66-report/dimension.log").read_text()
          ours = [
              "changing_a_bores_diameter_keeps_its_dimension",
              "deleting_a_bore_loses_its_dimension_and_never_moves_it",
              "undo_and_redo_a_diameter_change_keep_its_dimension",
              "undo_and_redo_a_deleted_bore_restore_its_dimension",
              "reopening_a_plate_keeps_dimensions_and_a_lost_bores_last_value",
          ]
          if prototypes:
              ours += [
                  "the_plates_width_between_its_side_faces_follows_a_width_change",
                  "a_suppressed_bore_says_so_and_its_dimension_comes_back",
              ]
          bad = []
          for name in ours:
              line = re.search(rf"^test cmd::drawing_dimension::tests::{name} \.\.\. (\w+)$", text, re.M)
              verdict = line.group(1) if line else "MISSING"
              print(f"T66_OURS {name}: {verdict}")
              if verdict != "ok":
                  bad.append(name)
          for line in re.findall(r"^test (cmd::drawing_dimension::tests::\S+) \.\.\. FAILED$", text, re.M):
              print(f"T66_FAILED {line}")
          found = re.findall(r"test result: *([a-z]+)[.] *([0-9]+) passed; *([0-9]+) failed; *([0-9]+) ignored;", text)
          print(f"T66_RESULT {found}")
          assert len(ours) == expect and not bad, f"not ok: {bad}"
          assert len(found) == 1 and found[0][0] == "ok" and found[0][2] == "0" and found[0][3] == "0", found
          print(f"T66_DIMENSION_TESTS=PASS count={found[0][1]} ours={len(ours)}")
          PY
          test "$code" = 0
      - name: Preserve original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t66-${{ matrix.prototypes == 'yes' && 'stack-11823' || 'drawings' }}
          path: test66-report/
          if-no-files-found: warn
          retention-days: 14
