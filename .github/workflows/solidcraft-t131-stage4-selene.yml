name: SolidCraft Stage 4 Test 131 SELENE Native Persistence
on:
  push:
    branches:
      - tests/solidcraft-t131-selene-persistence
permissions:
  contents: read
jobs:
  selene-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: selene-stage4-native-t131
      - name: Verify original SELENE fixture and pinned test baseline
        run: |
          set -euo pipefail
          MODEL=assets/render/selene/models/SELENE-functional.solidcraft
          test "$(git hash-object "$MODEL")" = "b30fd8db0f841f97ffd756914350c2b71d2f3c2e"
          test "$(wc -c < "$MODEL" | tr -d ' ')" = "439883"
          echo "3bd2bfa1c6336394c4a4208d30b52c80d06658a3bd7ea57cc93b774411d1bd68  $MODEL" | sha256sum --check
          unzip -t -qq "$MODEL"
          echo "SELENE_T131_BASE=f3e2898a3acea737bff987a6f9600e3b78eba352"
          git rev-parse HEAD
      - name: Run native SELENE multi-sheet save/reopen and reference recovery
        run: |
          set -euo pipefail
          mkdir -p t131-report
          timeout 135m cargo test -p solidcraft-ui-egui --lib --profile ci stage4_selene_multisheet_native_save_reopen_keeps_valid_and_suppressed_dimensions -- --nocapture 2>&1 | tee t131-report/result.log
      - name: Preserve complete original CI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t131-selene-native-persistence
          path: t131-report/
          retention-days: 30
