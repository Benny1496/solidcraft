name: SolidCraft Test 149 isolated drawings integration
on:
  push:
    branches: [tests/solidcraft-t149-drawings-integration]
    paths: ['.github/workflows/solidcraft-t149-drawings-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    name: Merge check and repair regression
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream drawings and attempt isolated merge
        run: |
          git config user.name "SolidCraft CI"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream drawings
          echo "Upstream drawings: $(git rev-parse FETCH_HEAD)"
          git merge --no-commit --no-ff FETCH_HEAD
          echo "Isolated merge succeeded; no PR branch modified"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl1 libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libudev-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Check UI crate and regression
        run: |
          cargo check --locked -p solidcraft-ui-egui
          cargo test --locked -p solidcraft-ui-egui repair_lost_bore_through_visible_buttons_review_confirm_and_undo -- --nocapture
      - name: Diagnostics on failure
        if: failure()
        run: |
          git status --short || true
          df -h . || true
