name: "SolidCraft Test 72: PR 8288 rebased onto drawings 188192c with the feature-id test, CI's checks and known-failing (fork only)"

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-pr8288-rebased-72.yml
      - tests/fixtures/t72/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-pr8288-rebased-72
  cancel-in-progress: false

env:
  BASE_SHA: 188192cb8bc1eac9f515120df80df5d5f66205f1
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  pr8288:
    name: "Test 72 - PR 8288 (0881b93) on drawings@188192c: repository checks, clippy, all engine tests, known-failing"
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      SOLIDCRAFT_GPU: software
      SOLIDCRAFT_REQUIRE_GPU: "1"
      ACTION_MATRIX_JOBS: "4"
    steps:
      - name: Make room on the runner
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Checkout the patches (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout drawings at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangency-labs/solidcraft
          ref: 188192cb8bc1eac9f515120df80df5d5f66205f1
          path: src
          persist-credentials: false
      - name: Apply PR 8288's rebased head
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(grep -c '^fn radial' crates/engine/src/drawing_dimension_tests.rs)" = 1
          git apply --index ../overlay/tests/fixtures/t72/pr8288-on-188192c.diff
          git diff --cached --stat
          echo "T72_APPLIED=PASS (PR 8288 rebased, 0881b93, nothing else applied)"
      - name: Install a software Vulkan driver (lavapipe), as the upstream test job does
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: t71-gate
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Repository checks, as the upstream "Format and repository checks" job runs them
        shell: bash
        working-directory: src
        run: |
          set -uo pipefail
          mkdir -p ../t72-report
          fails=0
          check() {
            local name="$1"; shift
            if "$@" > "../t72-report/check-${name}.log" 2>&1; then
              echo "T72_CHECK ${name}: PASS"
            else
              echo "T72_CHECK ${name}: FAIL"; tail -40 "../t72-report/check-${name}.log"; fails=$((fails + 1))
            fi
          }
          check fmt cargo fmt --all -- --check
          check assets cargo xtask assets
          check icons cargo xtask icons
          check licences cargo xtask licences --check
          check layers cargo xtask layers
          check ui-containers bash -c 'cargo xtask ui-containers && cargo test -p xtask ui_containers --locked'
          check lists cargo xtask lists
          check i18n cargo xtask i18n --check
          check skills bash -c 'cargo xtask skills && cargo test -p xtask skills --locked'
          check format-pending bash scripts/test-format-pending.sh
          check web-offline cargo xtask web-offline-test
          check affected-selftest python3 -I scripts/ci/test_affected.py
          check main-merge-selftest python3 -I scripts/ci/test_main_merge.py
          check bot-tests bash -c 'node --test scripts/claim/*.test.js scripts/triage/*.test.js scripts/kernel-paused/*.test.js scripts/pr-checks/*.test.js'
          check w23a-static python3 -I tests/fixtures/w23a-drawing-updates/validate.py
          echo "T72_CHECKS_FAILED=${fails}"
          test "$fails" = 0
      - name: Clippy -D warnings on the engine, all targets
        if: always()
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          timeout 120m cargo clippy -p solidcraft-engine --all-targets --profile ci --locked -- -D warnings 2>&1 | tee ../t72-report/clippy.log
          test "${PIPESTATUS[0]}" = 0
          echo "T72_CLIPPY_ENGINE=PASS"
      - name: All engine tests as CI runs them, then known-failing grades the run
        if: always()
        shell: bash
        working-directory: src
        run: |
          set +e
          set -uo pipefail
          base='default() & not (binary(action_matrix) & test(=action_matrix_sample))'
          timeout 230m cargo nextest run -p solidcraft-engine --cargo-profile ci --locked --profile ci --no-tests=pass \
            --ignore-default-filter -E "($base) & not (package(=solidcraft-gpu) & test(/^path::/))" 2>&1 | tee ../t72-report/engine-tests.log
          status=${PIPESTATUS[0]}
          cp target/nextest/ci/junit.xml ../t72-report/engine-junit.xml 2>/dev/null
          grep -E "Summary \[" ../t72-report/engine-tests.log | sed 's/^/T72_SUMMARY /'
          grep -E "^\s+(FAIL|SIGSEGV|SIGABRT|TIMEOUT) " ../t72-report/engine-tests.log | sort -u | sed 's/^/T72_NOT_PASSED /' | head -40
          echo "T72_NEXTEST_EXIT=$status (0 all passed, 100 some failed)"
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          cargo xtask known-failing --junit target/nextest/ci/junit.xml 2>&1 | tee ../t72-report/known-failing.log
          kf=${PIPESTATUS[0]}
          echo "T72_KNOWN_FAILING_EXIT=$kf"
          test "$kf" = 0 && echo "T72_ENGINE_TESTS_AS_CI=PASS"
          test "$kf" = 0
      - name: Preserve original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t72-pr8288-rebased
          path: t72-report/
          if-no-files-found: warn
          retention-days: 14

