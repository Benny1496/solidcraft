name: "SolidCraft Test 68: the drawing prototypes again, sheet compared within 1e-9 mm, with the observations (fork only)"

on:
  push:
    branches:
      - tests/w23-assembly-sheet-bom-20261104
    paths:
      - .github/workflows/solidcraft-prototypes-68.yml
      - tests/fixtures/t68/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-prototypes-68
  cancel-in-progress: false

env:
  BASE_SHA: 49eedf122ca01d94390c8779e1adf5cb1a911fab
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  prototypes:
    name: "Test 68 - prototypes on PR 8288 (5 dimensions, R2 centres, the sheet, fillets) and observations"
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Make room on the runner
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Checkout the patches (this fork branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout drawings at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangency-labs/solidcraft
          ref: 49eedf122ca01d94390c8779e1adf5cb1a911fab
          path: src
          persist-credentials: false
      - name: Apply #11953, PR 8288 and the prototypes
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Benny1496/solidcraft"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --index ../overlay/tests/fixtures/t67/fix11953.diff
          git apply --index ../overlay/tests/fixtures/t67/pr8288-6d62ba4.diff
          git apply --index ../overlay/tests/fixtures/t68/prototypes-t68.diff
          git diff --cached --stat
          echo "T68_APPLIED=PASS"
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: t67-prototypes
          cache-on-failure: true
      - name: fmt and clippy -D warnings on the engine
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../t68-report
          rustfmt --edition 2024 --check crates/engine/src/cmd/drawing_dimension_tests.rs
          echo "T68_FMT=PASS"
          timeout 110m cargo clippy -p solidcraft-engine --all-targets --profile ci -- -D warnings 2>&1 | tee ../t68-report/clippy.log
          test "${PIPESTATUS[0]}" = 0
          echo "T68_CLIPPY=PASS"
      - name: Every engine test with drawing in its name, and the observations
        shell: bash
        working-directory: src
        run: |
          set +e
          set -uo pipefail
          timeout 60m cargo test --profile ci -p solidcraft-engine --lib drawing -- --test-threads=2 2>&1 | tee ../t68-report/drawing.log
          code=${PIPESTATUS[0]}
          timeout 30m cargo test --profile ci -p solidcraft-engine --lib cmd::drawing_dimension::tests::observe_ -- --ignored --nocapture --test-threads=1 2>&1 | tee ../t68-report/observe.log
          timeout 30m cargo test --profile ci -p solidcraft-engine --lib cmd::drawing_dimension::tests::the_plates_sheet_draws -- --nocapture --test-threads=1 2>&1 | tee -a ../t68-report/observe.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("../t68-report/drawing.log").read_text()
          ours = {
              "PR 8288": [
                  "changing_a_bores_diameter_keeps_its_dimension",
                  "deleting_a_bore_loses_its_dimension_and_never_moves_it",
                  "undo_and_redo_a_diameter_change_keep_its_dimension",
                  "undo_and_redo_a_deleted_bore_restore_its_dimension",
                  "reopening_a_plate_keeps_dimensions_and_a_lost_bores_last_value",
                  "the_plates_width_between_its_side_faces_follows_a_width_change",
                  "a_suppressed_bore_says_so_and_its_dimension_comes_back",
              ],
              "new prototype": [
                  "the_plates_five_dimensions_follow_each_parameter_and_its_undo",
                  "the_bores_centres_stay_put_and_a_lost_bore_takes_its_centre_dimensions",
                  "the_plates_sheet_draws_what_the_model_has_and_the_same_after_undo",
                  "fillets_on_the_plates_corners_leave_its_five_dimensions_read",
              ],
          }
          for group, names in ours.items():
              for name in names:
                  line = re.search(rf"^test cmd::drawing_dimension::tests::{name} \.\.\. (\w+)$", text, re.M)
                  print(f"T68_OURS [{group}] {name}: {line.group(1) if line else 'MISSING'}")
          print("\n".join(l for l in text.splitlines() if "T67_EXACT" in l))
          for name in re.findall(r"^test (\S+) \.\.\. FAILED$", text, re.M):
              print(f"T68_FAILED {name}")
          for block in re.findall(r"^---- (\S+) stdout ----\n(.*?)(?=^---- |^failures:$)", text, re.M | re.S):
              print(f"T68_FAILURE_DETAIL {block[0]}:")
              print("\n".join(block[1].strip().splitlines()[:12]))
          print("T68_RESULT", re.findall(r"test result: *([a-z]+)[.] *([0-9]+) passed; *([0-9]+) failed; *([0-9]+) ignored;", text))
          observed = Path("../t68-report/observe.log").read_text()
          for line in observed.splitlines():
              if "T67_OBSERVE" in line or "T67_EXACT" in line or re.match(r"^test .*observe_.* \.\.\. ", line) or "panicked" in line:
                  print(line)
          PY
          test "$code" = 0 && echo "T68_DRAWING_TESTS=PASS"
          test "$code" = 0
      - name: Preserve original output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-t68-prototypes
          path: t68-report/
          if-no-files-found: warn
          retention-days: 14

