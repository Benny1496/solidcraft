name: SolidCraft T167 upstream patch applicability
on:
  push:
    branches: [tests/solidcraft-t165-upstream-integration]
    paths: ['.github/workflows/solidcraft-t165-upstream-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh upstream merge and conflict details
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SolidCraft CI"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream drawings
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)"
          echo "REVIEW_SHA=$(git rev-parse HEAD)"
          git cat-file -e FETCH_HEAD:crates/ui-egui/src/drawing_workspace/panels.rs
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          result=$?
          set -e
          echo "MERGE_EXIT=$result"
          git diff "$(git merge-base HEAD FETCH_HEAD)" HEAD -- crates/ui-egui/src/drawing_workspace.rs > /tmp/t167-ours.patch
          test -s /tmp/t167-ours.patch
          git diff --name-only --diff-filter=U
          if [ "$result" -ne 0 ]; then
            test "$(git diff --name-only --diff-filter=U)" = "crates/ui-egui/src/drawing_workspace.rs"
            echo "EXPECTED_WORKSPACE_CONFLICT=true"
            git checkout --theirs -- crates/ui-egui/src/drawing_workspace.rs
            git add crates/ui-egui/src/drawing_workspace.rs
            git show "HEAD:crates/ui-egui/src/drawing_workspace.rs" > /tmp/t166-ours.rs
            git show "FETCH_HEAD:crates/ui-egui/src/drawing_workspace.rs" > /tmp/t166-upstream.rs
            echo "OURS_LINES=$(wc -l < /tmp/t166-ours.rs)"
            echo "UPSTREAM_LINES=$(wc -l < /tmp/t166-upstream.rs)"
            echo "Trying strict patch replay on upstream workspace"
            if git apply --3way --index /tmp/t167-ours.patch; then
              echo "PATCH_APPLIED=true"
              test -z "$(git diff --name-only --diff-filter=U)"
              grep -q "status_controller" crates/ui-egui/src/drawing_workspace.rs
              grep -q "mod panels;" crates/ui-egui/src/drawing_workspace.rs
            else
              echo "::error::Patch requires manual reconciliation; no false-positive integration result"
              exit 1
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
          else
            echo "CLEAN_MERGE=true"
          fi
