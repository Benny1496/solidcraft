name: SolidCraft T165 upstream integration preflight
on:
  push:
    branches: [tests/solidcraft-t165-upstream-integration]
    paths: ['.github/workflows/solidcraft-t165-upstream-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate upstream snapshot and integration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SolidCraft CI"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch --no-tags upstream drawings
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)"
          echo "REVIEW_SHA=$(git rev-parse HEAD)"
          echo "MERGE_BASE=$(git merge-base HEAD FETCH_HEAD)"
          # panels.rs was introduced upstream; it is intentionally absent in this old review branch.
          git cat-file -e FETCH_HEAD:crates/ui-egui/src/drawing_workspace/panels.rs
          git diff "$(git merge-base HEAD FETCH_HEAD)" HEAD -- crates/ui-egui/src/drawing_workspace.rs > /tmp/ours.patch
          test -s /tmp/ours.patch
          echo "T165_PREFLIGHT_OK=true"
