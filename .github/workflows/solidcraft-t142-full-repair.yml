name: SolidCraft Test 142 - Full Repair Flow
on:
  push:
    branches:
      - feature/issue-15776-drawings-20261113
    paths:
      - '.github/workflows/solidcraft-t142-full-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tested revision
        run: git rev-parse HEAD
      - name: Compile repair UI and engine
        run: cargo check -p solidcraft-ui-egui -p solidcraft-engine
      - name: UI repair eligibility and cancellation
        run: cargo test -p solidcraft-ui-egui --lib drawing_repair_ui -- --nocapture
      - name: Explicit confirmation and invalid selection
        run: cargo test -p solidcraft-ui-egui --lib drawing_dimension_repair -- --nocapture
      - name: End-to-end engine scenario - deleted bore repaired to replacement rim, undo
        run: cargo test -p solidcraft-engine --lib a_deleted_bores_dimension_reads_bore2_only_when_repaired_to_it -- --nocapture
      - name: End-to-end engine scenario - rounded rim lost then repaired
        run: cargo test -p solidcraft-engine --lib a_rounded_bore_rim_is_lost_and_a_repair_reads_it_again -- --nocapture
      - name: End-to-end engine scenario - repair layout and inspection
        run: cargo test -p solidcraft-engine --lib add_and_repair_answer_with_the_layout_inspect_gives -- --nocapture
      - name: Engine undo redo atomicity
        run: cargo test -p solidcraft-engine --lib a_repair_is_one_undo_step_and_undone_is_lost_again -- --nocapture
      - name: Engine invalid repair leaves drawing unchanged
        run: cargo test -p solidcraft-engine --lib a_bad_repair_pick_changes_nothing -- --nocapture
      - name: Drawing status and browser regressions
        run: cargo test -p solidcraft-ui-egui --lib drawing_status_controller -- --nocapture
      - name: Drawing browser tests
        run: cargo test -p solidcraft-ui-egui --lib drawing_workspace -- --nocapture
