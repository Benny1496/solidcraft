name: SolidCraft Test 205 - pinned drawing port and official grading
on:
  push:
    branches:
      - tests/t205-pr16310-pinned-main-20261119
    paths:
      - '.github/workflows/solidcraft-t205.yml'
permissions:
  contents: read
jobs:
  drawing:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      PINNED_BASE: 32efab6cfc2cdd0967410bbb1c078f8517eabc8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t205"
          cp -r tests/fixtures/t204 "$RUNNER_TEMP/t205-fixtures"
          git fetch --no-tags https://github.com/Benny1496/solidcraft.git 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          base=$(git merge-base 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 cc5acc82b9cb8fcbc624537b14d18c58efd6321f)
          test "$base" = f1cc6e70f9337bc940ecc27d2f1d31438df36ce2
          git diff --binary "$base" 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 -- . ':!crates/ui-egui/src/drawing_workspace.rs' > "$RUNNER_TEMP/t205/original.patch"
          git switch --detach cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          test "$(git rev-parse HEAD)" = cc5acc82b9cb8fcbc624537b14d18c58efd6321f
          git apply --3way --index "$RUNNER_TEMP/t205/original.patch"
          cp -r "$RUNNER_TEMP/t205-fixtures/." .
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          git merge-tree --write-tree 9c5e805347a4ffdfc29d5cd65722a6d0e7035a22 c4c9aa1005135f4084c7d8776a4e3ff25c104e80 > "$RUNNER_TEMP/t205/merge-tree.txt" || true
          git add assets/locales/pending attribution/pending crates/ui-egui/src
          git diff --cached --binary HEAD -- . ':!crates/ui-egui/src/drawing_workspace.rs' ':!crates/ui-egui/src/drawing_workspace/browser.rs' > "$RUNNER_TEMP/t205/port.patch"
          git reset --hard HEAD
          git clean -fd
          git switch --detach c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          test "$(git rev-parse HEAD)" = c4c9aa1005135f4084c7d8776a4e3ff25c104e80
          git apply --3way --index "$RUNNER_TEMP/t205/port.patch"
          cp "$RUNNER_TEMP/t205-fixtures/crates/ui-egui/src/drawing_workspace/browser.rs" crates/ui-egui/src/drawing_workspace/browser.rs
          git add assets/locales/pending attribution/pending crates/ui-egui/src
          git diff --cached --check
          git diff --cached --binary -- . ':!crates/ui-egui/src/drawing_workspace.rs' > "$RUNNER_TEMP/t205/integration.patch"
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git 32efab6cfc2cdd0967410bbb1c078f8517eabc8d
          git reset --hard HEAD
          git clean -fd
          git switch --detach 32efab6cfc2cdd0967410bbb1c078f8517eabc8d
          git apply --3way --index "$RUNNER_TEMP/t205/integration.patch" || { git status --short; git diff --cc > "$RUNNER_TEMP/t205/conflicts.patch"; exit 1; }
          git diff --cached --check
          # Port only the feature additions, not the obsolete preference-era tests.
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path("crates/ui-egui/src/drawing_workspace.rs")
          upstream = path.read_text()
          old = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "t205-fixtures" / path).read_text()
          field_anchor = "    pub(crate) page: crate::drawing_sheet_page::Page,\n"
          assert upstream.count(field_anchor) == 1 and old.count(field_anchor) == 1
          fields = old.split(field_anchor, 1)[1].split("\n}", 1)[0]
          assert len(fields.splitlines()) == 6 and "status_controller:" in fields and "repair_ui:" in fields
          helpers = old.split("pub(crate) fn invalidate_status(", 1)[1].split("pub fn active(", 1)[0]
          active = "pub fn active("
          assert upstream.count(active) == 1
          test_anchor = "#[cfg(test)]\nmod repair_through_the_browser {"
          assert old.count(test_anchor) == 1 and test_anchor not in upstream
          regression = test_anchor + old.split(test_anchor, 1)[1]
          regression, removed = re.subn(r"(?m)^[ \t]*h\.app\.preferences\.drawings_preview = true;\n", "", regression)
          assert removed == 1 and "drawings_preview" not in regression
          result = upstream.replace(field_anchor, field_anchor + fields + "\n", 1)
          result = result.replace(active, "pub(crate) fn invalidate_status(" + helpers + active, 1)
          result = result.rstrip() + "\n\n" + regression.rstrip() + "\n"
          # Keep every upstream test; retain the retired-key compatibility JSON unchanged.
          tests = lambda s: set(re.findall(r"#\[test\]\s+(?:#\[[^\n]+\]\s+)*fn (\w+)\(", s))
          assert tests(result) == tests(upstream) | {"repair_lost_bore_through_visible_buttons_review_confirm_and_undo"}
          assert re.findall(r"(?m)^.*\bdrawings_preview\b.*$", result) == re.findall(r"(?m)^.*\bdrawings_preview\b.*$", upstream)
          path.write_text(result)
          PY
          git add crates/ui-egui/src/drawing_workspace.rs
          git diff --cached --check
          git diff --cached --name-only | tee "$RUNNER_TEMP/t205/product-files.txt"
          test -s "$RUNNER_TEMP/t205/product-files.txt"
          if grep -vE '^(crates/ui-egui/src/|assets/locales/pending/|attribution/pending/)' "$RUNNER_TEMP/t205/product-files.txt"; then
            echo "Unexpected product scope"; exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/t205/product.patch"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev libwayland-dev libasound2-dev pkg-config xvfb xauth dbus-x11 at-spi2-core python3-pyatspi libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dri openbox
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest
      - name: Format and verify scope
        id: format
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff HEAD --name-only | sort > "$RUNNER_TEMP/t205/formatted-files.txt"
          diff -u "$RUNNER_TEMP/t205/product-files.txt" "$RUNNER_TEMP/t205/formatted-files.txt"
          git diff HEAD --check
          git diff HEAD --binary > "$RUNNER_TEMP/t205/formatted.patch"
          if grep -nE 'T19[4-7] (CLICK|CLEAR|REFRESH|CONFIRM)|t194_handle' crates/ui-egui/src/drawing_repair_ui.rs crates/ui-egui/src/drawing_workspace.rs; then exit 1; fi
          cargo xtask fast --base "$PINNED_BASE" --list | tee "$RUNNER_TEMP/t205/scope.txt"
          if grep -qE '^fast: solidcore crates changed:' "$RUNNER_TEMP/t205/scope.txt"; then
            echo "Unexpected kernel scope"; exit 1
          fi
      - name: Run official fast checks once (tests graded separately)
        id: fast
        run: |
          set -euo pipefail
          cargo xtask fast --base "$PINNED_BASE" --no-tests 2>&1 | tee "$RUNNER_TEMP/t205/fast.txt"
      - name: Drawing engine and UI tests with official CI grading
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/t205"
          junit=target/nextest/ci/junit.xml
          rm -f "$junit"
          status=0
          cargo nextest run -p solidcraft-engine -p solidcraft-ui-egui --features solidcraft-engine/raytrace-cpu --cargo-profile ci --locked --profile ci --no-tests=fail --ignore-default-filter --no-fail-fast --retries 0 --test-threads 2 -E 'default() & test(drawing)' 2>&1 | tee "$report/nextest.txt" || status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "$status" -ne 100 ]; then exit "$status"; fi
          test -s "$junit"
          cp "$junit" "$report/junit.xml"
          cargo xtask known-failing --junit "$junit" 2>&1 | tee "$report/grading.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T205-drawing-results
          path: ${{ runner.temp }}/t205/
