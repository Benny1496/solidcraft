# SolidCraft fork-only experiment: manually build the browser app and run its built-in API test.
# This workflow intentionally has no push, pull_request, or schedule trigger.
# GitHub's "Run workflow" button becomes available when the workflow exists on the default branch.
name: SolidCraft Browser Smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcraft-browser-smoke
  cancel-in-progress: true

jobs:
  browser-test:
    name: Build WebAssembly and test browser API
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out SolidCraft source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up stable Rust and WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned Trunk
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check all CAD browser scenarios for JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          failed=0
          for script in xtask/src/browser_*_test.js; do
            echo "Checking $script"
            if node --check "$script"; then
              echo "PASS $script"
            else
              echo "::error file=$script::JavaScript syntax check failed"
              failed=$((failed + 1))
            fi
          done
          echo "JavaScript syntax failures: $failed"
          test "$failed" -eq 0
      - name: Build SolidCraft web app
        id: build
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./
      - name: Run SolidCraft browser command API smoke test
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: cargo xtask web-api-test --site dist/web
      - name: Test drawing window mouse interactions in real egui harness
        id: gui
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo test -p solidcraft-ui-egui drawing_ui::tests --lib -- --nocapture
      - name: Test drawing geometry signatures and invalid snapshots in Rust engine
        id: engine
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo test -p solidcraft-engine drawing_preview --lib -- --nocapture
      - name: Save built web app even when a CAD test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-web-tested
          path: dist/web/
          if-no-files-found: ignore
          retention-days: 3
      - name: Summarize every test and fail the workflow if any check failed
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          GUI: ${{ steps.gui.outcome }}
          ENGINE: ${{ steps.engine.outcome }}
        run: |
          echo "## SolidCraft consolidated test results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Independent test group | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for entry in "JavaScript syntax|$SYNTAX" "WebAssembly build|$BUILD" "Browser API + CAD suite|$BROWSER" "Real egui drawing interactions|$GUI" "Drawing engine regression|$ENGINE"; do
            name="${entry%%|*}"
            result="${entry#*|}"
            if [ "$result" = "success" ]; then
              echo "| $name | PASS |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$name did not pass ($result)"
              failed=$((failed + 1))
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Test groups not passing: $failed**" >> "$GITHUB_STEP_SUMMARY"
          echo "Consolidated test groups not passing: $failed"
          # Preserve a truthful red workflow, but only AFTER independent
          # suites have run. A skipped browser test after a failed build
          # is an unverified check, never a green result.
          test "$failed" -eq 0


  # Separate upstream contribution is checked out at its own branch so the
  # experimental 2D Drawing code never leaks into #4950's oracle results.
  # Both jobs run independently in the SAME manual workflow invocation.
  workshop-oracle-4950:
    name: Upstream #4950 full oracle and independent workshop maths
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out dedicated upstream contribution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/upstream-4950-oracle
          persist-credentials: false
      - name: Regenerate independent workshop analytic expected geometry
        run: python3 tools/oracle-analytic/cases_workshop.py
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: workshop-oracle-4950
      - name: Compile SolidCraft's native oracle CLI
        run: cargo build -p solidcraft-cli --profile ci --locked
      - name: Replay ALL SolidCraft oracle models including 12 new #4950 cases
        run: cargo xtask oracle --cli target/ci/solidcraft-cli
      - name: Save oracle output report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workshop-oracle-4950-report
          path: docs/oracle.md
          if-no-files-found: ignore
          retention-days: 7
